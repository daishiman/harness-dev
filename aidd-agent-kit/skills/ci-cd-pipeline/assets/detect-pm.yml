name: Node.jsとパッケージマネージャを準備
description: ロックファイルからnpm・yarn・pnpmを判別し、Node.js 22と依存関係を再現可能な形で準備する

outputs:
  name:
    description: 判別したパッケージマネージャ名
    value: ${{ steps.detect.outputs.name }}
  run:
    description: package.jsonのscriptを実行するコマンド
    value: ${{ steps.detect.outputs.run }}
  exec:
    description: ローカルバイナリを実行するコマンド
    value: ${{ steps.detect.outputs.exec }}

runs:
  using: composite
  steps:
    # 宣言ではなく実在するロックファイルを根拠にする。移行途中で複数ある場合の
    # 優先順は pnpm → yarn → npm に固定する。
    - name: パッケージマネージャを判別
      id: detect
      shell: bash
      run: |
        if [ -f pnpm-lock.yaml ]; then
          echo "name=pnpm" >> "$GITHUB_OUTPUT"
          echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          echo "run=pnpm run" >> "$GITHUB_OUTPUT"
          echo "exec=pnpm exec" >> "$GITHUB_OUTPUT"
        elif [ -f yarn.lock ]; then
          if [ -f .yarnrc.yml ]; then
            echo "install=yarn install --immutable" >> "$GITHUB_OUTPUT"
          else
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          fi
          echo "name=yarn" >> "$GITHUB_OUTPUT"
          echo "run=yarn run" >> "$GITHUB_OUTPUT"
          echo "exec=yarn" >> "$GITHUB_OUTPUT"
        else
          echo "name=npm" >> "$GITHUB_OUTPUT"
          echo "install=npm ci" >> "$GITHUB_OUTPUT"
          echo "run=npm run" >> "$GITHUB_OUTPUT"
          echo "exec=npx" >> "$GITHUB_OUTPUT"
        fi

    # setup-nodeのcache判定より先にpnpmを用意する。
    - uses: pnpm/action-setup@v6
      if: ${{ steps.detect.outputs.name == 'pnpm' }}

    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: ${{ steps.detect.outputs.name }}

    - name: 依存関係を固定バージョンでインストール
      shell: bash
      run: ${{ steps.detect.outputs.install }}
