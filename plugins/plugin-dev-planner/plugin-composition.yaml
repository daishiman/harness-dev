name: plugin-dev-planner
description: プラグイン構想を index、13 フェーズファイル、component inventory、型付き task graph の実行可能な計画へ分解する非配布 planning plugin。
kind: plugin-composition
version: 0.1.15
owner: team-platform
distributable: false

contract:
  intent: 実プラグインの build と分離した前段で、構想を漏れのない capability inventory、13-phase plan、build handoff へ変換する。
  interface:
    inputs: [plugin-concept, intake-json, improvement-handoff]
    outputs: [index.md, phase-files, component-inventory.json, task-graph.json, build-handoff.json]
  invariant:
    - 計画のみを生成し、実プラグインや実コードを作成しないこと
    - elicitor、architect、evaluator の単方向 handoff と proposer-not-approver を維持すること
    - 後段 build route は harness-creator の公開 capability への外部契約として明示すること

capabilities:
  - { kind: skill, ref: skills/assign-plugin-plan-evaluator, tier: core }
  - { kind: skill, ref: skills/run-plugin-dev-plan, tier: core }
  - { kind: skill, ref: skills/run-skill-feedback, tier: core }
  - { kind: agent, ref: agents/plugin-dev-plan-architect, tier: core }
  - { kind: agent, ref: agents/plugin-dev-plan-elicitor, tier: core }
  - { kind: agent, ref: agents/plugin-dev-plan-evaluator, tier: core }
  - { kind: agent, ref: agents/plugin-dev-plan-improvement-reviewer, tier: core }
  - { kind: command, ref: commands/plugin-dev-plan, tier: core }
  - { kind: hook, ref: "hook:PostToolUse-EditWrite/hook-validate-plugin-plan", tier: core }
  - { kind: hook, ref: "hook:PreToolUse-BashTask/enforce-provenance-chain", tier: core }

dependencies:
  # 内部 DAG: orchestrator skill が各 R 責務 agent を fork。pipeline は elicitor→architect→evaluator の単方向。
  - { from: skills/run-plugin-dev-plan, to: agents/plugin-dev-plan-elicitor,  type: calls,    note: "R1 goal-spec 確定" }
  - { from: skills/run-plugin-dev-plan, to: agents/plugin-dev-plan-architect, type: calls,    note: "R2/R3 分解 + 生成" }
  - { from: skills/run-plugin-dev-plan, to: skills/assign-plugin-plan-evaluator, type: evaluates, note: "R4 独立評価を assign skill へ委譲 (proposer≠approver)" }
  - { from: skills/assign-plugin-plan-evaluator, to: agents/plugin-dev-plan-evaluator, type: calls, note: "R1(evaluate) を fork 実行" }
  - { from: agents/plugin-dev-plan-elicitor,  to: agents/plugin-dev-plan-architect,  type: emits,   note: "goal-spec.json" }
  - { from: agents/plugin-dev-plan-architect, to: agents/plugin-dev-plan-evaluator, type: emits,   note: "plan ディレクトリ (13 phase files + inventory + index)" }
external_dependencies:
  harness-creator:
    version: ">=1.4.0 <2.0.0"
    relation: skill-feedback-ssot-provider
    required_entry_points: [run-skill-feedback, run-skill-create, run-build-skill, run-elegant-review, run-goal-elicit]
    edges:
      # routes_to は enum 外。実 build を投入せず handoff に route を記録するので delegates。
      - {from: skills/run-plugin-dev-plan, to: skills/run-skill-create, type: delegates}
      - {from: skills/run-plugin-dev-plan, to: skills/run-build-skill, type: delegates}
      - {from: skills/run-plugin-dev-plan, to: skills/run-elegant-review, type: calls}
      - {from: skills/run-plugin-dev-plan, to: skills/run-goal-elicit, type: calls}

eval_sinks: [EVALS.json]
observability:
  hooks:
    - PostToolUse-EditWrite/hook-validate-plugin-plan
    - PreToolUse-BashTask/enforce-provenance-chain

quality_gates:
  - python3 scripts/validate-plugin-completeness.py
  - python3 -m pytest plugins/plugin-dev-planner/skills/run-plugin-dev-plan/tests -q
  - python3 -m pytest plugins/plugin-dev-planner/skills/assign-plugin-plan-evaluator/tests -q
