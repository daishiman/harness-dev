name: company-master
description: 会社名・住所・法人番号の断片から企業マスタを確度付きで補完し、確認済みプレビューのみを固定 Notion DB へ反映する plugin。
kind: plugin-composition
version: 0.1.9
owner: harness maintainers

contract:
  intent: 企業の同定・属性補完・検証・Notion 反映を分離し、不確実な値の自動確定を避けながら企業マスタの新規構築と既存行 backfill を行う。
  interface:
    inputs: [company-fragments, notion-master-row, web-findings]
    outputs: [validated-company-row, mutation-preview, notion-upsert-receipt]
  invariant:
    - 法人番号が一意確定できない値は自動確定せず、空欄と要確認根拠を残すこと
    - Notion 書き込みは preview-confirm-authorize-execute を経た明示許可済み操作に限ること
    - API トークンは macOS Keychain から都度解決し、repository や出力に残さないこと

capabilities:
  - {kind: skill, ref: skills/run-company-master-build, tier: core}
  - {kind: skill, ref: skills/run-company-master-backfill, tier: core}
  - {kind: command, ref: commands/company-master, tier: core}
  - {kind: command, ref: commands/company-master-backfill, tier: core}
  - {kind: agent, ref: agents/company-master-resolve-identity, tier: core}
  - {kind: agent, ref: agents/company-master-enrich-attributes, tier: core}
  - {kind: agent, ref: agents/company-master-notion-upsert, tier: core}
  - {kind: hook, ref: "hook:PreToolUse-Bash/hook-guard-secret", tier: core}
  # 公開 wrapper と独立起動可能な proxy だけを bundle-level capability とする。
  - {kind: script, ref: scripts/company_master.py, tier: core}
  - {kind: script, ref: scripts/postal_proxy.py, tier: extension}

dependencies:
  - {from: commands/company-master, to: skills/run-company-master-build, type: calls}
  - {from: commands/company-master-backfill, to: skills/run-company-master-backfill, type: calls}
  - {from: skills/run-company-master-build, to: agents/company-master-resolve-identity, type: calls}
  - {from: skills/run-company-master-build, to: agents/company-master-enrich-attributes, type: calls}
  - {from: skills/run-company-master-build, to: agents/company-master-notion-upsert, type: calls}
  - {from: skills/run-company-master-backfill, to: agents/company-master-resolve-identity, type: calls}
  - {from: skills/run-company-master-backfill, to: agents/company-master-enrich-attributes, type: calls}
  - {from: skills/run-company-master-backfill, to: agents/company-master-notion-upsert, type: calls}
  - {from: skills/run-company-master-build, to: scripts/company_master.py, type: calls}
  - {from: skills/run-company-master-build, to: scripts/postal_proxy.py, type: calls}
  - {from: skills/run-company-master-backfill, to: scripts/company_master.py, type: calls}
  - {from: skills/run-company-master-backfill, to: scripts/postal_proxy.py, type: calls}

# External services and credentials are runtime requirements, not capability-DAG edges.
runtime_requirements:
  external_services:
    - Notion API
    - gBizINFO API
    - Japan Post addresszip API
  credentials:
    storage: macOS Keychain
    services:
      - notion-api-key.<keychain-prefix>
      - gbizinfo-api-token.<keychain-prefix>
      - japanpost-da-api.<keychain-prefix>

distribution:
  python_dependencies:
    policy: 標準ライブラリ優先。外部ライブラリが必要な場合は plugin-root/vendor/ へ同梱する。
    status: 現状は外部依存ゼロで pip install 不要。
    enforcement: scripts/lint-company-master-vendored-deps.py

observability:
  hooks: [PreToolUse-Bash/hook-guard-secret]
