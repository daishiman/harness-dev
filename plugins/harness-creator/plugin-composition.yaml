# dependencies[] is the DAG of capabilities declared by this composition only.
# The two HC compatibility forwarders resolve the distributable provider through
# this explicit cross-plugin contract instead of pretending its files are HC
# capabilities.
external_dependencies:
  skill-governance-adapters:
    version: ">=0.1.1 <1.0.0"
    relation: external-intelligence-runtime-provider
    required_entry_points: [run-governance-adapters]
    required_runtime_scripts:
      - hooks/build-external-intelligence-context.py
      - scripts/build-external-intelligence-runtime.py
      - scripts/build-external-intelligence.py
    required_runtime_resources:
      - schemas/external-intelligence-runtime.schema.json
      - references/external-intelligence-runtime-contract.md

eval_sinks:
  - EVALS.json
  - lessons-learned/

governance:
  rubric_refs:
    - skills/ref-skill-design-rubric/references/rubric.json
    - skills/ref-domain-rubric-template/references/rubric.json
    - skills/ref-domain-task-spec-rubric/references/rubric.json
  changelog: CHANGELOG.md
  roadmap: ROADMAP.md
  merge_strategy: deep-merge
  conflict_policy: most-specific-wins

observability:
  hooks:
    - SessionStart/auto-sync-on-session-start
    - PostToolUse/external-intelligence-observe
    - PostToolUseFailure/external-intelligence-observe
    - PostToolUse-Skill/content-review-queue
    - PostToolUse-EditWrite/lint-capability-manifest
    - PostToolUse-EditWrite/content-review-queue
    - PostToolUse-Edit-rubric/diff-rubric-impact
    - SessionEnd/aggregate-evals
    - Stop/elegant-review-trigger
  metrics:
    - lessons_per_pr # curated lessons only
    - duplicate_observation_rate
    - helpful_reuse_count
    - promotion_evidence_count
    - review_cycle_time_ms
    - rubric_bump_frequency
    - capability_count_by_kind
  lessons_path: lessons-learned/ # reviewed promotion surface only; runtime state is outside the plugin package
