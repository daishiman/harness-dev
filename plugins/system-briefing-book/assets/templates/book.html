<!doctype html>
<html lang="ja" class="nojs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="system-briefing-book">
<title>{{TITLE}}</title>
<style>
/* 案件の配色 (_src/tokens.css をそのまま埋め込む) */
{{TOKENS_CSS}}
</style>
<style>
/* まとめ HTML の見た目。色と文字は上の配色 (jp-web-design の標準カラーとボードの言葉) の役割を受ける。
   tokens.css が無いときも、build-briefing-book.mjs が標準カラーを埋め込むので、ここに色の値は書かない。 */
:root {
  --book-brand: var(--text-heading);
  --book-ink: var(--text-primary);
  --book-ink-2: var(--text-secondary);
  --book-muted: var(--text-muted);
  --book-link: var(--link);
  --book-link-hover: var(--link-hover);
  --book-line: var(--border-subtle);
  --book-line-strong: var(--border-control);
  --book-page: var(--app-background);
  --book-surface: var(--surface);
  --book-stripe: var(--surface-alt);
  --book-brand-soft: var(--surface-selected);
  --book-inverse: var(--text-inverse);
  --book-nav-bg: var(--nav-background);
  --book-nav-text: var(--nav-text-muted);
  --book-nav-hover: var(--nav-hover);
  --book-nav-on-bg: var(--nav-selected-bg);
  --book-nav-on-text: var(--nav-selected-text);
  --book-nav-on-mark: var(--nav-selected-indicator);
  --book-th-bg: var(--table-head-bg);
  --book-th-text: var(--table-head-text);
  --book-can-ink: var(--note-can-ink);
  --book-can-bg: var(--note-can-bg);
  --book-how-ink: var(--note-how-ink);
  --book-how-bg: var(--note-how-bg);
  --book-ask-ink: var(--note-ask-ink);
  --book-ask-bg: var(--note-ask-bg);
  --book-anno: var(--anno);
  --book-anno-ink: var(--anno-ink);
  --book-overlay: var(--overlay);
  --book-shadow: var(--shadow-soft);
  --book-font: var(--font-ui);
  --book-num: var(--font-num);
  --bar-h: 52px;
  --toc-w: 264px;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--bar-h) + 12px); }
body { margin: 0; font-family: var(--book-font); color: var(--book-ink); background: var(--book-page); line-height: 1.75; font-size: 15.5px; -webkit-font-smoothing: antialiased; }
a { color: var(--book-link); text-underline-offset: .2em; }
a:hover { color: var(--book-link-hover); }
:where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid var(--focus-ring); outline-offset: 3px; box-shadow: 0 0 0 3px var(--focus-gap); }
/* 数字は欧文の書体で、桁をそろえて描く (jp-web-design §1-4) */
.tb-count, .toc .no, .cover .facts b, .board-notes .mark, .d-meta-line b, .d-kpi b, .d-no { font-variant-numeric: tabular-nums; }
.skip { position: absolute; left: -999px; top: 0; }
.skip:focus { left: 12px; top: 12px; z-index: 100; background: var(--book-surface); padding: 6px 12px; }

/* 上のバー */
.topbar { position: sticky; top: 0; z-index: 30; height: var(--bar-h); display: flex; align-items: center; gap: 18px; padding: 0 20px; background: var(--book-surface); border-bottom: 1px solid var(--book-line); }
.tb-title { min-width: 0; display: flex; align-items: baseline; gap: 12px; white-space: nowrap; overflow: hidden; }
.tb-title b { font-size: 16px; color: var(--book-brand); overflow: hidden; text-overflow: ellipsis; }
.tb-title span { font-size: 13px; color: var(--book-muted); }
.tb-pager { margin-left: auto; display: none; align-items: center; gap: 10px; font-size: 14px; }
.js .tb-pager { display: flex; }
.tb-pager a { text-decoration: none; font-weight: 700; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--book-line); background: var(--book-surface); }
.tb-pager a.off { pointer-events: none; opacity: .35; }
.tb-count { font-family: var(--book-num); color: var(--book-ink-2); min-width: 64px; text-align: center; }
.tb-pager a, .tb-count { white-space: nowrap; }

/* 目次と本文 */
.layout { display: grid; grid-template-columns: var(--toc-w) minmax(0, 1fr); align-items: start; }
.toc { position: sticky; top: var(--bar-h); height: calc(100vh - var(--bar-h)); overflow-y: auto; padding: 18px 14px 28px; border-right: 1px solid var(--book-line); background: var(--book-nav-bg); font-size: 14px; line-height: 1.5; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc li { margin: 0; }
.toc a { display: block; padding: 5px 10px; border-radius: 6px; color: var(--book-nav-text); text-decoration: none; }
.toc a:hover { background: var(--book-nav-hover); }
.toc a.p { font-weight: 700; color: var(--book-ink); }
.toc a.on { background: var(--book-nav-on-bg); color: var(--book-nav-on-text); box-shadow: inset 3px 0 0 var(--book-nav-on-mark); }
.toc ol ol a { padding-left: 24px; font-size: 13px; }
/* 文書の小見出しは、開いている文書の分だけ出す (JS が動かないときは全部) */
.js .toc li > ol { display: none; }
.js .toc li.cur > ol { display: block; }
.toc .grp { margin: 14px 10px 4px; font-size: 12px; font-weight: 800; color: var(--book-muted); letter-spacing: .06em; }
.toc .no { font-family: var(--book-num); color: var(--book-brand); margin-right: 6px; }
.toc-foot { margin: 18px 10px 0; font-size: 12px; color: var(--book-muted); }
main { min-width: 0; padding: 28px clamp(16px, 4vw, 56px) 64px; }
.page { max-width: 1180px; margin: 0 auto 56px; background: var(--book-surface); border: 1px solid var(--book-line); border-radius: 14px; padding: 32px clamp(18px, 3vw, 44px) 28px; box-shadow: var(--book-shadow); }
.js main > .page { display: none; margin-bottom: 0; }
.js main > .page.on { display: block; }
.page-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--book-line); padding-bottom: 12px; margin-bottom: 18px; }
.page-head .kind { font-size: 13px; font-weight: 800; color: var(--book-brand); letter-spacing: .05em; }
.page-head h2 { margin: 0; font-size: 26px; line-height: 1.35; }
.page-head .reader { margin-left: auto; font-size: 13px; color: var(--book-muted); }

/* 表紙 */
.cover h1 { margin: 6px 0 4px; font-size: 34px; line-height: 1.3; }
.cover .sub { color: var(--book-ink-2); font-size: 16px; }
.cover .facts { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 18px 0 24px; padding: 14px 18px; border-radius: 10px; background: var(--book-stripe); font-size: 15px; }
.cover .facts b { font-family: var(--book-num); }
.cover h3 { margin: 26px 0 8px; font-size: 18px; }
.cover ol.howto { margin: 0; padding-left: 1.4em; }
.readers { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.reader-card { border: 1px solid var(--book-line); border-radius: 10px; padding: 14px 16px; }
.reader-card h4 { margin: 0 0 6px; font-size: 16px; color: var(--book-brand); }
.reader-card ul { margin: 0; padding-left: 1.2em; font-size: 14.5px; }

/* ボード */
.board-page .message { margin: -6px 0 16px; font-size: 17px; font-weight: 700; color: var(--book-ink-2); }
figure.shot { margin: 0; }
figure.shot > a.zoom { display: block; border: 1px solid var(--book-line); border-radius: 10px; overflow: hidden; cursor: zoom-in; background: var(--book-page); }
figure.shot img { display: block; width: 100%; height: auto; }
figure.shot figcaption { margin-top: 6px; font-size: 12.5px; color: var(--book-muted); text-align: right; }
figure.shot .close { display: none; }
figure.shot:target { position: fixed; inset: 0; z-index: 60; background: var(--book-overlay); overflow: auto; padding: 56px 20px 20px; }
figure.shot:target > a.zoom { width: max-content; max-width: none; margin: 0 auto; cursor: default; border: 0; }
figure.shot:target img { width: min(1680px, calc(100vw - 40px)); max-width: none; }
figure.shot:target figcaption { display: none; }
figure.shot:target .close { display: block; position: fixed; top: 12px; right: 16px; padding: 6px 14px; border-radius: 8px; background: var(--book-surface); color: var(--book-ink); font-weight: 700; text-decoration: none; }
.board-notes { margin-top: 20px; }
.board-notes h3 { margin: 18px 0 10px; font-size: 14px; font-weight: 800; color: var(--book-muted); letter-spacing: .04em; }
.board-notes ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.board-notes li { display: grid; grid-template-columns: 30px auto 1fr; align-items: baseline; gap: 4px 10px; }
.board-notes .mark { width: 24px; height: 24px; border-radius: 50%; background: var(--book-anno); color: var(--book-anno-ink); font: 800 13px/24px var(--book-num); text-align: center; }
.board-notes .mark.none { background: transparent; }
.board-notes .kind { font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 4px; white-space: nowrap; }
.board-notes .kind.can { color: var(--book-can-ink); background: var(--book-can-bg); }
.board-notes .kind.how { color: var(--book-how-ink); background: var(--book-how-bg); }
.board-notes .kind.ask { color: var(--book-ask-ink); background: var(--book-ask-bg); }
.board-notes .txt b { font-weight: 800; }
.board-notes .txt .q { margin-left: 6px; font: 700 12px/1.6 var(--book-num); color: var(--book-ask-ink); background: var(--book-ask-bg); padding: 0 6px; border-radius: 4px; }
.board-notes .txt .sub { display: block; color: var(--book-ink-2); font-size: 14.5px; }

/* 文書 (Markdown から) */
.doc h2 { font-size: 26px; margin: 0 0 6px; line-height: 1.35; }
.doc h3 { font-size: 20px; margin: 34px 0 10px; padding-top: 14px; border-top: 1px solid var(--book-line); }
.doc h4 { font-size: 17px; margin: 24px 0 8px; color: var(--book-brand); }
.doc h5, .doc h6 { font-size: 15.5px; margin: 18px 0 6px; }
.doc p { margin: 8px 0; }
.doc ul, .doc ol { margin: 8px 0; padding-left: 1.5em; }
.doc li { margin: 3px 0; }
.doc code { font-family: var(--book-num); font-size: .92em; background: var(--book-stripe); padding: 1px 5px; border-radius: 4px; }
.doc pre { background: var(--book-stripe); padding: 12px 14px; border-radius: 8px; overflow-x: auto; }
.doc blockquote { margin: 10px 0; padding: 6px 14px; border-left: 4px solid var(--book-line-strong); color: var(--book-ink-2); }
.tw { overflow-x: auto; margin: 12px 0 18px; border: 1px solid var(--book-line); border-radius: 8px; }
.tw table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.6; }
.tw th, .tw td { padding: 8px 12px; border-bottom: 1px solid var(--book-line); text-align: left; vertical-align: top; }
.tw th { background: var(--book-th-bg); color: var(--book-th-text); font-weight: 800; white-space: nowrap; }
.tw tr:last-child td { border-bottom: 0; }

/* ページ送り (JS なしでも動く) */
.pg-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--book-line); font-size: 14px; }
.pg-nav a { text-decoration: none; font-weight: 700; max-width: 48%; }
.pg-nav .next { margin-left: auto; text-align: right; }

@media (max-width: 900px) {
  .layout { display: block; }
  .toc { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--book-line); }
  .js .toc { display: none; }
  .js .toc.open { display: block; }
  .tb-title span { display: none; }
  .page-head .reader { margin-left: 0; }
}
@media (max-width: 480px) {
  /* スマホ幅でも、ページ送りのボタンは 1 行に収める (題は … で切る) */
  .topbar { gap: 10px; padding: 0 12px; }
  .tb-pager { gap: 6px; }
  .tb-pager a { padding: 5px 9px; }
  .tb-count { min-width: 0; }
}

/* 印刷: 文書は A4 縦、ボードは 1 枚 1 ページの A4 横。注記の文は画像に写っているので印刷しない */
@page { size: A4 portrait; margin: 14mm 12mm; }
@page board { size: A4 landscape; margin: 8mm; }
@media print {
  body { background: none; font-size: 10.5pt; }
  .topbar, .toc, .pg-nav, .skip, figure.shot figcaption, figure.shot .close, .board-notes { display: none !important; }
  .layout { display: block; }
  main { padding: 0; }
  main > .page, .js main > .page { display: block !important; break-before: page; border: 0; box-shadow: none; padding: 0; margin: 0; max-width: none; }
  main > .page:first-child { break-before: auto; }
  .board-page { page: board; }
  .board-page .page-head { margin-bottom: 4mm; padding-bottom: 2mm; }
  .board-page .message { display: none; }
  figure.shot > a.zoom { border: 0; }
  figure.shot img { width: auto; max-width: 100%; max-height: 170mm; margin: 0 auto; }
  .tw { overflow: visible; border: 0; }
  .tw tr { break-inside: avoid; }
  .doc h3, .doc h4 { break-after: avoid; }
  a { color: inherit; text-decoration: none; }
}
/* 文書のレポート形 (scripts/lib/doc-report.mjs の部品)。淡い灰の地に、題の帯と章ごとの白いカードを並べる。 */
.page.doc { background: transparent; border: 0; box-shadow: none; padding: 0; }
.page.doc > .pg-nav { margin-top: 8px; padding: 14px 6px 0; }
.d-hero, .d-sec { background: var(--book-surface); border: 1px solid var(--book-line); border-radius: 14px; box-shadow: var(--book-shadow); padding: 24px clamp(16px, 3vw, 36px); margin: 0 0 18px; }
.doc .d-kind { margin: 0; font-size: 13px; font-weight: 800; color: var(--book-brand); letter-spacing: .06em; }
.doc .d-hero h2.doc-title { font-size: 28px; margin: 2px 0 6px; }
.doc .d-meta-line { display: flex; margin: 0; flex-wrap: wrap; gap: 4px 18px; color: var(--book-muted); font-size: 13.5px; }
.d-meta-line b { font-family: var(--book-num); color: var(--book-ink-2); }
.d-kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 10px; margin: 18px 0 0; }
.d-kpi { display: grid; grid-template-columns: auto 1fr; align-items: baseline; column-gap: 4px; padding: 10px 14px; border-radius: 10px; background: var(--book-stripe); border: 1px solid var(--book-line); }
.d-kpi span { grid-column: 1 / -1; font-size: 12.5px; font-weight: 700; color: var(--book-muted); }
.d-kpi b { font: 800 28px/1.25 var(--book-num); color: var(--book-ink); }
.d-kpi small { font-size: 13px; color: var(--book-ink-2); }
.d-hero > :last-child { margin-bottom: 0; }

/* 章 */
.d-head { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--book-line); }
.d-no { flex: none; min-width: 34px; height: 34px; padding: 0 8px; border-radius: 10px; background: var(--book-brand); color: var(--book-inverse); font: 800 16px/34px var(--book-num); text-align: center; }
.doc .d-head h3 { margin: 0; padding: 0; border: 0; font-size: 20px; line-height: 1.4; }
.d-body > :first-child { margin-top: 0; }
.d-body > :last-child { margin-bottom: 0; }
.doc .d-sub h4, .doc .d-pane h4, .doc .d-mini h4 { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 16px; color: var(--book-ink); }
.d-subno { flex: none; padding: 3px 7px; border-radius: 6px; background: var(--book-brand-soft); color: var(--book-brand); font: 800 12.5px/1.2 var(--book-num); }
.d-sub + .d-sub { margin-top: 22px; }
.d-body > p + .d-sub, .d-body > div + .d-sub { margin-top: 22px; }
.d-item-card { border: 1px solid var(--book-line); border-radius: 12px; padding: 16px 18px; }
.d-sub.d-item-card + .d-sub.d-item-card { margin-top: 14px; }
.d-item-card h4 .d-subno { background: var(--book-brand); color: var(--book-inverse); }
.d-lead { padding: 12px 18px; border-radius: 10px; background: var(--book-brand-soft); font-size: 16.5px; font-weight: 600; }
.doc .d-lead p { margin: 4px 0; }
.doc .d-unit { display: inline-block; margin: 0 0 12px; padding: 4px 14px; border-radius: 999px; background: var(--book-brand-soft); color: var(--book-brand); font-weight: 700; font-size: 14.5px; }
.doc .d-cap { margin: 18px 0 6px; font-size: 13px; font-weight: 800; color: var(--book-muted); letter-spacing: .04em; }
.d-body .tw { margin: 0 0 4px; }
/* 項目表の短い列は折り返さない (説明の列に幅を回す) */
@media (min-width: 561px) {
  .d-fields td[data-k="種類"], .d-fields td[data-k="型"], .d-fields td[data-k="必須"] { white-space: nowrap; }
  .d-fields td[data-k="初期値"] { width: 8em; } /* 表のセルは min-width が効かないので width で下限を与える (余白込みで 6 文字) */
}
.d-muted { color: var(--book-muted); font-size: 13.5px; }

/* 札・番号 */
a.ref:not(.d-chip) { text-decoration: none; border-bottom: 1px dotted currentColor; }
.d-chip { display: inline-block; padding: 0 9px; border: 1px solid var(--book-line); border-radius: 999px; background: var(--book-stripe); color: var(--book-ink-2); font-size: 12.5px; font-weight: 700; line-height: 1.8; white-space: nowrap; text-decoration: none; }
a.d-chip:hover { border-color: var(--book-link); }
.d-chip.t-src, .d-chip.t-yes { border-color: transparent; background: var(--book-can-bg); color: var(--book-can-ink); }
.d-chip.t-heard { border-color: transparent; background: var(--book-how-bg); color: var(--book-how-ink); }
.d-chip.t-ask { border-color: transparent; background: var(--book-ask-bg); color: var(--book-ask-ink); }
.d-chip.t-want { background: var(--book-surface); border-color: var(--book-anno); color: var(--book-anno); }
.d-chip.t-screen { border-color: transparent; background: var(--book-brand-soft); color: var(--book-brand); font-family: var(--book-num); }
.d-chip.t-phone { background: var(--book-brand); border-color: var(--book-brand); color: var(--book-inverse); }
.d-chip.t-pc { background: var(--book-surface); border-color: var(--book-brand); color: var(--book-brand); }
.d-src { display: inline-flex; flex-wrap: wrap; align-items: baseline; gap: 2px 5px; }
.d-src-at { font-size: 12.5px; color: var(--book-muted); overflow-wrap: anywhere; }
.d-id { flex: none; display: inline-block; min-width: 46px; padding: 1px 8px; border-radius: 6px; background: var(--book-brand-soft); color: var(--book-brand); font: 800 13px/1.75 var(--book-num); text-align: center; }
.d-id.t-ask { background: var(--book-ask-bg); color: var(--book-ask-ink); }
.d-must { display: inline-block; padding: 0 7px; border: 1px solid var(--book-anno); border-radius: 4px; color: var(--book-anno); font-size: 12px; font-weight: 800; white-space: nowrap; }
.d-label { display: inline-block; margin-right: 8px; font-size: 12px; font-weight: 800; color: var(--book-muted); letter-spacing: .03em; }

/* カード */
.d-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.d-cards.d-wide { grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); }
.d-card { border: 1px solid var(--book-line); border-radius: 12px; padding: 14px 16px; background: var(--book-surface); }
.doc .d-card p { margin: 4px 0; }
.d-card-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 6px; }
.doc .d-card-top .d-name { margin: 0; }
.d-name { font-size: 16px; font-weight: 800; line-height: 1.5; }
.d-count { color: var(--book-ink-2); }
.d-count b { font: 800 26px/1.2 var(--book-num); color: var(--book-brand); }
.d-meta { font-size: 13px; color: var(--book-muted); }
.d-line { font-size: 14.5px; }
/* 決まったかどうかは札 (未決 / 決定) で示す。カードの縁に色の帯を付けない (jp-web-design の恒久ルール) */
.d-q.is-done { background: var(--book-stripe); }
.d-role .d-label { display: block; margin: 0; }
.d-role .t-can .d-label { color: var(--book-can-ink); }
.d-role .t-can .d-label::before { content: "✓ "; }
.d-role .t-cannot .d-label::before { content: "✕ "; }
.d-role .d-line + .d-line { margin-top: 10px; }

/* 行の並び */
.d-groups { display: grid; gap: 14px; }
.d-group { border: 1px solid var(--book-line); border-radius: 12px; overflow: hidden; }
.doc .d-group-h { display: flex; justify-content: space-between; gap: 12px; margin: 0; padding: 10px 16px; font-weight: 800; }
.d-group.t-yes .d-group-h { background: var(--book-can-bg); color: var(--book-can-ink); }
.d-group.t-later .d-group-h { background: var(--book-stripe); color: var(--book-ink-2); }
.d-n { font: 700 13px/1.8 var(--book-num); }
.doc .d-items, .doc .d-rows, .doc .d-qa, .doc .d-ops { list-style: none; margin: 0; padding: 0; }
.d-rows, .d-qa, .d-ops { border: 1px solid var(--book-line); border-radius: 12px; overflow: hidden; }
.d-items > li, .d-rows > li, .d-qa > li, .d-ops > li { display: flex; align-items: baseline; gap: 12px; margin: 0; padding: 10px 16px; border-top: 1px solid var(--book-line); }
.d-rows > li:first-child, .d-qa > li:first-child, .d-ops > li:first-child { border-top: 0; }
.d-group.t-later .d-items > li { color: var(--book-ink-2); }
.d-text, .d-qa > li > div { flex: 1; min-width: 0; }
.d-tags { flex: 0 1 auto; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; max-width: 44%; }
.doc .d-qa-q { margin: 0; font-weight: 700; }
.doc .d-qa-a { margin: 2px 0 0; color: var(--book-ink-2); }
.d-btn { flex: none; padding: 2px 12px; border: 1px solid var(--book-line-strong); border-radius: 8px; background: var(--book-surface); box-shadow: 0 1px 0 var(--book-line-strong); font-size: 14px; font-weight: 700; }
.d-to { flex: none; }
.d-sub-lines { flex: 0 1 36%; display: flex; flex-direction: column; gap: 2px; font-size: 13.5px; }

/* 定義 */
.doc .d-dl { display: grid; grid-template-columns: minmax(5em, max-content) 1fr; margin: 0; border: 1px solid var(--book-line); border-radius: 12px; overflow: hidden; }
.d-dl > div { display: grid; grid-column: 1 / -1; grid-template-columns: minmax(7em, 24%) 1fr; grid-template-columns: subgrid; gap: 16px; padding: 10px 16px; border-top: 1px solid var(--book-line); }
.d-dl > div:first-child { border-top: 0; }
.d-dl dt { max-width: 15em; font-weight: 800; color: var(--book-ink-2); }
.d-dl dd { margin: 0; }
.d-why { display: block; margin-top: 2px; color: var(--book-muted); font-size: 13.5px; }
.doc .d-terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; margin: 0; }
.d-terms > div { padding: 10px 14px; border: 1px solid var(--book-line); border-radius: 10px; }
.d-terms dt { font-weight: 800; color: var(--book-brand); }
.d-terms dd { margin: 2px 0 0; font-size: 14.5px; }

/* 画面・データのカードの中の短い札 (目的・使う人・端末・開き方・ボード) */
.doc .d-facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); grid-auto-flow: row dense; gap: 8px; margin: 0 0 4px; }
.d-facts > div { padding: 7px 12px; border-radius: 8px; background: var(--book-stripe); }
.d-facts > .is-wide { grid-column: 1 / -1; }
.d-facts dt { font-size: 12px; font-weight: 800; color: var(--book-muted); }
.d-facts dd { margin: 0; }

/* 対比・格子 */
.d-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.d-pair.is-flow { grid-template-columns: 1fr auto 1fr; }
.d-arrow { align-self: center; color: var(--book-muted); font-size: 22px; font-weight: 800; }
.d-pane, .d-mini { padding: 14px 16px; border: 1px solid var(--book-line); border-radius: 12px; }
/* やる / やらない、今 / これからは、見出しと ✓ ✕ で示す。縁の色帯は使わず、やらない側と今の側を一段沈めるだけ */
.d-pane.t-no, .d-pane.t-before { background: var(--book-stripe); }
.d-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.d-mini .d-list > li { font-size: 14.5px; }

/* 箇条書き */
.doc .d-list, .doc .d-steps { list-style: none; margin: 0; padding: 0; }
.d-list > li { position: relative; margin: 0; padding: 6px 0 6px 22px; border-top: 1px dashed var(--book-line); }
.d-list > li:first-child { border-top: 0; }
.d-list > li::before { content: ""; position: absolute; left: 6px; top: calc(6px + .62em); width: 7px; height: 7px; border-radius: 50%; background: var(--book-brand); }
.d-pane.t-yes .d-list > li::before, .d-pane.t-no .d-list > li::before { content: "✓"; top: 6px; left: 2px; width: auto; height: auto; border-radius: 0; background: none; color: var(--book-can-ink); font-weight: 800; }
.d-pane.t-no .d-list > li::before { content: "✕"; color: var(--book-muted); }
.d-pane.t-no .d-list > li { color: var(--book-ink-2); }
.d-steps { counter-reset: st; }
.d-steps > li { position: relative; margin: 0; padding: 3px 0 14px 40px; counter-increment: st; }
.d-steps > li:last-child { padding-bottom: 0; }
.d-steps > li::before { content: counter(st); position: absolute; left: 0; top: 1px; width: 28px; height: 28px; border-radius: 50%; background: var(--book-brand); color: var(--book-inverse); font: 800 14px/28px var(--book-num); text-align: center; }
.d-steps > li::after { content: ""; position: absolute; left: 13px; top: 32px; bottom: 2px; width: 2px; background: var(--book-line); }
.d-steps > li:last-child::after { display: none; }
.t-before .d-steps > li::before { background: var(--book-muted); }

@media (max-width: 560px) {
  .d-hero, .d-sec { padding: 18px 16px; border-radius: 12px; }
  .doc .d-hero h2.doc-title { font-size: 22px; }
  .d-pair, .d-pair.is-flow { grid-template-columns: 1fr; }
  .d-arrow { justify-self: center; transform: rotate(90deg); }
  .d-dl > div { grid-template-columns: 1fr; gap: 2px; }
  .d-items > li, .d-rows > li, .d-qa > li, .d-ops > li { flex-wrap: wrap; row-gap: 6px; }
  .d-tags, .d-sub-lines { flex-basis: 100%; max-width: none; justify-content: flex-start; }
  .d-ops .d-text { flex-basis: 100%; order: 3; }
  .d-ops .d-to { margin-left: auto; }
  .d-item-card { padding: 12px; }
  /* 項目の表は、1 行を 1 枚の札に積む。小さな見出しは td の data-k */
  .d-fields { border: 0; overflow: visible; }
  .d-fields thead { display: none; }
  .d-fields table, .d-fields tbody, .d-fields tr, .d-fields td { display: block; }
  .d-fields tr { margin: 0 0 8px; padding: 8px 12px; border: 1px solid var(--book-line); border-radius: 10px; }
  .d-fields td { padding: 2px 0; border: 0; }
  .d-fields td + td::before { content: attr(data-k); display: inline-block; min-width: 4.5em; margin-right: 8px; font-size: 12px; font-weight: 800; color: var(--book-muted); }
}

@media print {
  .page.doc > .pg-nav { display: none; }
  .d-hero, .d-sec { margin: 0 0 6mm; padding: 0; border: 0; border-radius: 0; box-shadow: none; }
  .d-head { break-after: avoid; }
  .d-card, .d-kpi, .d-pane, .d-mini, .d-item-card, .d-terms > div, .d-dl > div,
  .d-items > li, .d-rows > li, .d-qa > li, .d-ops > li, .d-list > li, .d-steps > li { break-inside: avoid; }
}
</style>
</head>
<body>
<a class="skip" href="#main">本文へ</a>
<header class="topbar">
  <div class="tb-title"><b>{{PROJECT}}</b><span>打ち合わせ資料 {{VERSION}} ・ 更新日 {{UPDATED}}</span></div>
  <nav class="tb-pager" aria-label="ページ送り">
    <a class="tb-toc" href="#toc">目次</a>
    <a class="tb-prev" href="#" rel="prev">← 前へ</a>
    <span class="tb-count"><span class="tb-cur">1</span> / {{PAGE_COUNT}}</span>
    <a class="tb-next" href="#" rel="next">次へ →</a>
  </nav>
</header>
<div class="layout">
<nav class="toc" id="toc" aria-label="目次">
{{NAV}}
<p class="toc-foot">全 {{PAGE_COUNT}} ページ<br>作成 {{BUILT}}</p>
</nav>
<main id="main">
{{PAGES}}
</main>
</div>
<script>
(function () {
  var pages = Array.prototype.slice.call(document.querySelectorAll('main > section.page'));
  if (!pages.length) return;
  var tocLinks = Array.prototype.slice.call(document.querySelectorAll('.toc a[href^="#"]'));
  var cur = document.querySelector('.tb-cur');
  var prev = document.querySelector('.tb-prev');
  var next = document.querySelector('.tb-next');
  var toc = document.getElementById('toc');
  var shown = -1;
  function pageIndex(id) {
    if (!id) return 0;
    if (/^z\d+$/.test(id)) id = 'b' + id.slice(1);
    var el = document.getElementById(id);
    var sec = el && el.closest('section.page');
    var i = pages.indexOf(sec);
    return i < 0 ? 0 : i;
  }
  function show() {
    var id;
    try { id = decodeURIComponent(location.hash.slice(1)); } catch (_) { id = ''; }
    var openToc = id === 'toc';
    var i = openToc && shown >= 0 ? shown : pageIndex(id);
    toc.classList.toggle('open', openToc);
    pages.forEach(function (p, k) { p.classList.toggle('on', k === i); });
    tocLinks.forEach(function (a) {
      var on = a.classList.contains('p') && pageIndex(a.getAttribute('href').slice(1)) === i;
      a.classList.toggle('on', on);
      if (on) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
      if (a.classList.contains('p')) a.parentNode.classList.toggle('cur', on);
    });
    cur.textContent = String(i + 1);
    prev.href = '#' + pages[Math.max(0, i - 1)].id;
    next.href = '#' + pages[Math.min(pages.length - 1, i + 1)].id;
    prev.classList.toggle('off', i === 0);
    next.classList.toggle('off', i === pages.length - 1);
    document.documentElement.classList.remove('nojs');
    document.documentElement.classList.add('js');
    var changed = shown !== i;
    shown = i;
    if (openToc) { toc.scrollIntoView(); return; }
    if (/^z\d+$/.test(id)) return;
    var target = id && document.getElementById(id);
    if (target && target !== pages[i]) target.scrollIntoView();
    else if (changed) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', show);
  document.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey || e.shiftKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    var zoomed = /^#z\d+$/.test(location.hash);
    if (e.key === 'Escape' && zoomed) { location.hash = '#b' + location.hash.slice(2); e.preventDefault(); return; }
    if (zoomed) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { if (shown < pages.length - 1) location.hash = '#' + pages[shown + 1].id; e.preventDefault(); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { if (shown > 0) location.hash = '#' + pages[shown - 1].id; e.preventDefault(); }
  });
  window.addEventListener('beforeprint', function () { document.documentElement.classList.remove('js'); });
  window.addEventListener('afterprint', function () { document.documentElement.classList.add('js'); });
  show();
})();
</script>
</body>
</html>
