  <text x="690" y="79" fill="var(--ink, #16191d)" font-size="12.5" text-anchor="middle" font-weight="600">速さ</text>
  <rect x="16" y="96" width="828" height="46" rx="8" fill="var(--surface, #ffffff)" stroke="var(--rule, #d5dae1)" stroke-width="1" />
