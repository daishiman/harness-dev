<svg id="hbdg-dg-versus-1" role="img" viewBox="0 0 860 178">
  <title>自前で作るか既製品を使うか</title>
  <text x="16" y="31" fill="var(--ink, #16191d)" font-size="15" text-anchor="start" font-weight="700">自前で作るか既製品を使うか</text>
  <rect x="16" y="54" width="402" height="108" rx="8" fill="var(--pop-primary-soft, #d9edfe)" stroke="var(--pop-primary, #43a4f5)" stroke-width="1" />
  <text x="217" y="81" fill="var(--ink, #16191d)" font-size="15" text-anchor="middle" font-weight="600">自前で作る</text>
  <circle cx="32" cy="103" r="3" fill="var(--pop-primary, #43a4f5)" aria-hidden="true" />
  <text x="46" y="111" fill="var(--ink, #16191d)" font-size="12.5" text-anchor="start">自由度が高い</text>
  <circle cx="32" cy="129" r="3" fill="var(--pop-primary, #43a4f5)" aria-hidden="true" />
  <text x="46" y="137" fill="var(--ink, #16191d)" font-size="12.5" text-anchor="start">工数がかかる</text>
  <rect x="442" y="54" width="402" height="108" rx="8" fill="var(--pop-accent-soft, #fdeadb)" stroke="var(--pop-accent, #f2994a)" stroke-width="1" />
  <text x="643" y="81" fill="var(--ink, #16191d)" font-size="15" text-anchor="middle" font-weight="600">既製品を使う</text>
  <circle cx="458" cy="103" r="3" fill="var(--pop-accent, #f2994a)" aria-hidden="true" />
  <text x="472" y="111" fill="var(--ink, #16191d)" font-size="12.5" text-anchor="start">早く始められる</text>
  <line x1="430" y1="54" x2="430" y2="162" stroke="var(--rule, #d5dae1)" stroke-width="2" aria-hidden="true" />
</svg>
