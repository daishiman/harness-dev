<svg id="hbdg-dg-versus-1" role="img" viewBox="0 0 860 184">
  <title>自前で作るか既製品を使うか</title>
  <text x="16" y="32" fill="var(--ink, #1b2733)" font-size="16" text-anchor="start" font-weight="700">自前で作るか既製品を使うか</text>
  <rect x="16" y="55" width="402" height="113" rx="8" fill="var(--pop-primary-soft, #d9edfe)" stroke="var(--pop-primary-deep, #2273b8)" stroke-width="1" />
  <text x="217" y="83" fill="var(--ink, #1b2733)" font-size="16" text-anchor="middle" font-weight="600">自前で作る</text>
  <circle cx="32" cy="105" r="3" fill="var(--pop-primary-deep, #2273b8)" aria-hidden="true" />
  <text x="46" y="114" fill="var(--ink, #1b2733)" font-size="14" text-anchor="start">自由度が高い</text>
  <circle cx="32" cy="133" r="3" fill="var(--pop-primary-deep, #2273b8)" aria-hidden="true" />
  <text x="46" y="142" fill="var(--ink, #1b2733)" font-size="14" text-anchor="start">工数がかかる</text>
  <rect x="442" y="55" width="402" height="113" rx="8" fill="var(--subtle, #f4f8fc)" stroke="var(--pop-primary-deep, #2273b8)" stroke-width="1" />
  <text x="643" y="83" fill="var(--ink, #1b2733)" font-size="16" text-anchor="middle" font-weight="600">既製品を使う</text>
  <circle cx="458" cy="105" r="3" fill="var(--pop-primary-deep, #2273b8)" aria-hidden="true" />
  <text x="472" y="114" fill="var(--ink, #1b2733)" font-size="14" text-anchor="start">早く始められる</text>
  <line x1="430" y1="55" x2="430" y2="168" stroke="var(--line, #dbe6ef)" stroke-width="2" aria-hidden="true" />
</svg>
