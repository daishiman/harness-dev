<svg id="hbdg-dg-flow-1" role="img" viewBox="0 0 860 144">
  <title>申請から承認までの流れ</title>
  <desc>申請者が出してから承認が下りるまでの 3 段階</desc>
  <text x="16" y="32" fill="var(--ink, #1b2733)" font-size="16" text-anchor="start" font-weight="700">申請から承認までの流れ</text>
  <rect x="16" y="55" width="260" height="73" rx="8" fill="var(--pop-primary-soft, #d9edfe)" stroke="var(--pop-primary-deep, #2273b8)" stroke-width="1" />
  <text x="146" y="83" fill="var(--ink, #1b2733)" font-size="16" text-anchor="middle" font-weight="600">申請する</text>
  <text x="146" y="110" fill="var(--ink-muted, #5b6b7a)" font-size="14" text-anchor="middle">様式Aを使う</text>
  <rect x="300" y="55" width="260" height="73" rx="8" fill="var(--pop-primary-soft, #d9edfe)" stroke="var(--pop-primary-deep, #2273b8)" stroke-width="1" />
  <text x="430" y="83" fill="var(--ink, #1b2733)" font-size="16" text-anchor="middle" font-weight="600">確認する</text>
  <rect x="584" y="55" width="260" height="73" rx="8" fill="var(--pop-primary-soft, #d9edfe)" stroke="var(--pop-primary-deep, #2273b8)" stroke-width="1" />
  <text x="714" y="83" fill="var(--ink, #1b2733)" font-size="16" text-anchor="middle" font-weight="600">承認する</text>
  <path d="M 278 91 L 291 91" fill="none" stroke="var(--pop-primary-deep, #2273b8)" stroke-width="2" aria-hidden="true" />
  <path d="M 299 91 L 290 96 L 290 86 Z" fill="var(--pop-primary-deep, #2273b8)" aria-hidden="true" />
  <path d="M 562 91 L 575 91" fill="none" stroke="var(--pop-primary-deep, #2273b8)" stroke-width="2" aria-hidden="true" />
  <path d="M 583 91 L 574 96 L 574 86 Z" fill="var(--pop-primary-deep, #2273b8)" aria-hidden="true" />
</svg>
