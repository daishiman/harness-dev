<svg id="hbdg-dg-flow-1" role="img" viewBox="0 0 860 140">
  <title>申請から承認までの流れ</title>
  <desc>申請者が出してから承認が下りるまでの 3 段階</desc>
  <text x="16" y="31" fill="var(--ink, #16191d)" font-size="15" text-anchor="start" font-weight="700">申請から承認までの流れ</text>
  <rect x="16" y="54" width="260" height="70" rx="8" fill="var(--pop-primary-soft, #d9edfe)" stroke="var(--pop-primary, #43a4f5)" stroke-width="1" />
  <text x="146" y="81" fill="var(--ink, #16191d)" font-size="15" text-anchor="middle" font-weight="600">申請する</text>
  <text x="146" y="107" fill="var(--ink-muted, #5b6470)" font-size="12.5" text-anchor="middle">様式Aを使う</text>
  <rect x="300" y="54" width="260" height="70" rx="8" fill="var(--pop-primary-soft, #d9edfe)" stroke="var(--pop-primary, #43a4f5)" stroke-width="1" />
  <text x="430" y="81" fill="var(--ink, #16191d)" font-size="15" text-anchor="middle" font-weight="600">確認する</text>
  <rect x="584" y="54" width="260" height="70" rx="8" fill="var(--pop-primary-soft, #d9edfe)" stroke="var(--pop-primary, #43a4f5)" stroke-width="1" />
  <text x="714" y="81" fill="var(--ink, #16191d)" font-size="15" text-anchor="middle" font-weight="600">承認する</text>
  <path d="M 278 89 L 291 89" fill="none" stroke="var(--pop-primary, #43a4f5)" stroke-width="2" aria-hidden="true" />
  <path d="M 299 89 L 290 94 L 290 84 Z" fill="var(--pop-primary, #43a4f5)" aria-hidden="true" />
  <path d="M 562 89 L 575 89" fill="none" stroke="var(--pop-primary, #43a4f5)" stroke-width="2" aria-hidden="true" />
  <path d="M 583 89 L 574 94 L 574 84 Z" fill="var(--pop-primary, #43a4f5)" aria-hidden="true" />
</svg>
