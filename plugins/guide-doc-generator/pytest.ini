[pytest]
# tests/<検査対象>/ の区切りが component 名をそのまま持つため、同じ役割のファイルが
# 同じ名前で各ディレクトリに並ぶ。既定の prepend 方式は basename でモジュールを
# 登録するので、CI のように木全体を 1 プロセスで集めると同名の 2 個目で収集が止まる。
# importlib 方式は登録名をパス由来にするため、この対称を崩さずに同居を許せる。
# 裸 import (`import _harness`) の解決は tests/conftest.py が補う。
addopts = --import-mode=importlib
testpaths = tests
