# CapabilityBundle 宣言 — plugins/slide-report-generator
# 正本スキーマ: ../harness-creator/skills/run-build-skill/references/capability-manifest.schema.json (kindPluginComposition)
# 用途: presentation-slide-generator v8.4.2 の全機能を移植し、output_mode=slide/report の 2 モードで
#       意匠/技術コアを単一 SSOT 共有するビジュアル生成 orchestrator プラグインの自己記述。

name: slide-report-generator
description: 共通コア + output_mode=slide/report の 2 モードで HTML スライド/レポートを生成・修正・横断検証するビジュアル生成ハーネス。意匠/技術層は単一 SSOT 共有・コンテンツ意図層のみ mode 別。Node 製エンジンは upstream byte-pin + 明示local overlay で携行。
kind: plugin-composition
version: 0.1.26
owner: harness maintainers
since: 2026-07-05
last-audited: 2026-07-05

contract:
  intent: 1 プラグイン内で output_mode(slide|report) を分岐し、意匠/技術コア(Kanagawa/16:9/GSAP/SVG2/Codex Image2/決定論レンダラ)を共有したまま、slide=1スライド1メッセージ・report=読み物/1項目1ビジュアルの成果物を生成・修正・横断検証する統一抽象を提供する。
  interface:
    inputs: [user-request, output_mode, reportType, structure.json, report-structure.json]
    outputs: [index.html, report.html, styles.css, scripts.js, evaluation-report.json, completion-report]
  invariant:
    - 意匠/技術層(配色/16:9/最小1.4rem/GSAP/インラインSVG2/印刷CSS/letterbox/Codex Image2/style genome/決定論レンダラ)は単一 SSOT で共有し slide/report で重複させないこと
    - コンテンツ意図層のみ output_mode で分岐する (slide=1メッセージ/chip強制/長文禁止 BP11-13、report=読み物/セクション+段落/1項目1ビジュアル)
    - Node 製レンダリング/画像/印刷/検証エンジンは vendor surface として携行し Python-stdlib へ書き換えないこと。skill/agent は Bash(node *) で起動する
    - vendor integrity は vendor-digest-manifest.json を正本とし、upstream 非改変ファイルは sha256 byte-pin、明示的 local fork/additive は owner 付き semantic contract + tests/goldens で検証すること (移植元 live tree 非依存)
    - report runtime を含む local fork は manifest の local_fork_managed に全件列挙し、未宣言の pin 不一致を許可しないこと。render-report.js の品質は tests_min>=80 + lint で担保すること
    - sub-agent/skill 本文は prompt-creator 7 層構造 (L1 基本定義 → L7 ユーザーインタラクション) で記述すること
    - 成果物本文・ヒアリング・評価は日本語、パラメーター名・JSON キー・CLI 引数・output_mode/reportType の enum 値は英語のままとすること
    - 生成後評価ゲート(deck-evaluator)は 30種思考法コアを共有しつつ mode 別 rubric 次元で区分評価する (単一 evaluator で mode-aware)
    - 実行パスは全て $CLAUDE_PLUGIN_ROOT 起点 (repo-root ハードコード禁止)

capabilities:
  - { kind: skill, ref: skills/ref-diagram-system, tier: core }
  - { kind: skill, ref: skills/run-cross-deck-review, tier: core }
  - { kind: skill, ref: skills/run-skill-feedback, tier: core }
  - { kind: skill, ref: skills/run-slide-report-generate, tier: core }
  - { kind: skill, ref: skills/run-slide-report-modify, tier: core }
  - { kind: skill, ref: skills/run-slide-report-status, tier: core }
  - { kind: agent, ref: agents/ai-image-diagram-producer, tier: core }
  - { kind: agent, ref: agents/cross-deck-reviewer, tier: core }
  - { kind: agent, ref: agents/d3-diagram-designer, tier: core }
  - { kind: agent, ref: agents/data-visualizer, tier: core }
  - { kind: agent, ref: agents/deck-evaluator, tier: core }
  - { kind: agent, ref: agents/hearing-facilitator, tier: core }
  - { kind: agent, ref: agents/html-generator, tier: core }
  - { kind: agent, ref: agents/layout-optimizer, tier: core }
  - { kind: agent, ref: agents/report-composer, tier: core }
  - { kind: agent, ref: agents/report-quality-reviewer, tier: core }
  - { kind: agent, ref: agents/report-structure-designer, tier: core }
  - { kind: agent, ref: agents/slide-renderer, tier: core }
  - { kind: agent, ref: agents/slide-report-modifier, tier: core }
  - { kind: agent, ref: agents/structure-designer, tier: core }
  - { kind: agent, ref: agents/structure-validator, tier: core }
  - { kind: agent, ref: agents/ui-quality-reviewer, tier: core }
  - { kind: agent, ref: agents/visual-strategist, tier: core }
  - { kind: command, ref: commands/slide-report-generate, tier: core }
  - { kind: command, ref: commands/slide-report-status, tier: core }
  - { kind: hook, ref: "hook:PostToolUse-WriteEditMultiEdit/hook-postgen-eval", tier: core }

  # === Skills (kind=skill) ===
  # 参照専用 (kind=ref / effect=none)。図解 1 枚を描くときの手続き知識の索引。

  # === Agents (kind=agent) — plugin.json agents 配線と 1 対 1 対応 ===

  # === Commands (kind=command) ===

  # === Hooks (kind=hook) ===

  # === Scripts (kind=script) === scripts/ 直下の実体と集合一致
  - { kind: script, ref: scripts/build-slide-skeleton-css.py,        tier: core }
  - { kind: script, ref: scripts/build-slide-skeleton-js.py,         tier: core }
  - { kind: script, ref: scripts/build-slide-skeletons.py,           tier: core }
  - { kind: script, ref: scripts/validate-output-mode.py,          tier: core }
  - { kind: script, ref: scripts/lint-vendor-parity.py,           tier: core }
  - { kind: script, ref: scripts/validate-plugin-completeness.py,  tier: core }
  # skill 私有 references/ の帰属完全性 (resource-map.yaml が orphan/dangling 0) を検査。
  # thin-adapter 昇格 references の SSOT 帰属を機械保証する (lint-skill-tree 第13条を内容完全性へ拡張)。
  - { kind: script, ref: scripts/lint-reference-attribution.py,    tier: core }
  # report.html の決定論視覚ゲート (section 構造/1項目1ビジュアル/段落密度/placeholder/印刷)。
  # slide の vendor verify-slides.js/validate-print.js に対称な report 用 Python-stdlib ゲート (C7 で vendor 不可侵ゆえ plugin-root 新設)。
  - { kind: script, ref: scripts/validate-report-visual.py,        tier: core }
  # report 経路 prose(references/prompts)↔code(render/validator/schema)の contract-drift ゲート。
  # 散文の data-*属性名/閾値/render-fidelity class/placement field を実装と機械突合し「宣言>実装」ドリフトを封鎖 (30思考法review の amplified pattern)。
  - { kind: script, ref: scripts/lint-contract-drift.py,           tier: core }
  # 散文の数詞 ↔ 正本の実測値 の count-parity ゲート。`<!-- count: <key> -->N` で宣言した個数を
  # schema enum / ファイル群 / 見出し群から実測した値と突合し、未宣言の数詞も検出する。
  # lint-contract-drift の検査 B は `key=N` 形式しか見ないため、自然文中の数詞は本 lint が担う。
  - { kind: script, ref: scripts/lint-count-parity.py,             tier: core }
  # 上 2 本 (lint-contract-drift / lint-count-parity) の起動口について。hook にも SKILL.md にも
  # 載っていないが、tests/test_lint_contract_drift.py と tests/test_lint_count_parity.py が
  # プラグイン実体 (_PLUGIN_ROOT) を対象に走るので、**合成 fixture ではなく実ツリーに届いている**。
  # 「テストからしか呼ばれていない = 合成入力しか見ていない」ではない。
  # なお EVALS.json の harness.mechanical[] を読む runner は存在しないので、そこへ行を足しても
  # 実行は 1 つも増えない。届くのは誰かが `pytest tests/` を叩いたときであって、EVALS 経由ではない。
  # ここを読まずに「配線されていない」と判断して hook へ足すと、同じ検査が 1 回の生成で 2 回走る。
  # 既知未修正・検査の届き方の台帳: references/known-unfixed.md (K-002)
  # 検査 ID が `sr:` で名指しする SR と、spec-registry.md の規則行との突合ゲート。
  # あわせて spec-registry.md §17 の欠落台帳の件数を実測し、散文の主張と突き合わせる
  # （exec-docs が `<!-- count: -->` 注釈で縛る予定。実測器は本 lint 側にある）。
  # 件数を lint-count-parity.py の MEASURERS へ寄せていないのは、あちらが「実測器は 0 を
  # 返さない」（0 は空集合という別の主張）を self-test で縛っているのに対し、この台帳の
  # 0 は**目標状態**だから。寄せると全部書き終えた日に self-test が倒れ、緑を保つために
  # 「まだ書き終えていないことにする」動機が生まれる。本 lint の実測器は 0 種のとき None を返す。
  # 節を分けて数えるのが要点。§17 の台帳行そのものを規則行として数えると、**台帳へ書く行為が
  # 台帳の対象を消す**（実測 2026-08-14: 欠落 7 種が 0 種に見えた）。
  - { kind: script, ref: scripts/lint-sr-ledger-parity.py,          tier: core }
  - { kind: script, ref: scripts/render-diagram-golden.cjs,         tier: core }
  - { kind: script, ref: scripts/render-production-golden.cjs,      tier: core }
  - { kind: script, ref: scripts/setup-playwright.py,               tier: core }
  # SR-4-03（比較レイアウトの比率）を判定する実行体。構成段階では CSS が無く判定
  # できないため、生成後の deck の CSS を見る。validate-structure.js の V-001 は
  # この検査器へ委ねる（deferred）。
  - { kind: script, ref: scripts/validate-compare-ratio.mjs,        tier: core }
  - { kind: script, ref: scripts/validate-diagram-information.py,   tier: core }
  # SR-3-09（<br> の位置が文節の切れ目か）を判定する実行体。語彙の正本は
  # vendor/scripts/utils.js の LINEBREAK_RULES で、挿入器 auto-linebreak.js と同じ集合を読む。
  # hook-postgen-eval の 1f として**両 mode で**実行する。対象が無いときに error ではなく
  # verdict=not-checked へ落ちるので、report.html のように未測定の入力へ当てても偽の赤を作らない。
  # **exit code だけで判定しないこと** — 対象 0 件と違反 0 件はどちらも exit 0 で、
  # 区別できるのは --json の verdict (not-checked / pass / fail) だけ。
  - { kind: script, ref: scripts/validate-linebreak-position.mjs,   tier: core }
  # 実体と言及を構造で分ける共通型（ライブラリ。単体で走る検査器ではない）。
  # html の script / style / HTML コメントを**同長の空白へ潰す**。同長なのは、位置で効く
  # 仕組み（lint-contract-drift の `<!-- css-route: -->` マーカー等）の照合先をずらさないため。
  # **現時点でどの検査器からも呼ばれていない。** lint-contract-drift.py が読むのは .md だけで、
  # markdown では言及かどうかを構造で判定できないため（実測 2026-08-14: インラインコードを
  # 剥がすと var() 参照が 393->329 へ減り、その中に spec-registry.md:177 の**標準実装の指示**が
  # 入っていた。同じ書き方で known-unfixed.md は**違反の記録**を書いており、構造が同一で
  # 意味が正反対）。呼び手が無いことを隠さずここに書くのは、次に剥がし処理が要る人が
  # これを見つけられず 3 つ目の実装を作るのを防ぐため。
  # 今の役割は上の validate-linebreak-position.mjs の maskNonProse と**同じ結果を出すことを
  # 機械で縛る契約**で、tests/test_mention_mask.py が node を実際に走らせて checked と突合する。
  - { kind: script, ref: scripts/mention_mask.py,                   tier: core }
  # 視覚生成規約 E1-E6（VGCONST）の静的検査。既存検査器はいずれも上限を見る禁止則で、
  # 面の上に階層を「作れているか」を見る検査が無かった。閾値は写経せず
  # references/visual-generation-rules.md から実行時に抽出する（抽出できなければ fail-closed）。
  - { kind: script, ref: scripts/validate-visual-generation.py,     tier: core }
  # 「面が視覚構造を持っているか」を面ごとに数える被覆検査（DC1-DC6）。既存の
  # validate-svg-diagram.py（上限）も validate-diagram-information.py（下限）も、
  # 図が 0 個の面には**検査対象が存在しない**ので緑を返す。文字リストだけの deck が
  # 全部緑で通っていた死角がここ。
  # ただし SVG の数では数えない。実測した反例（2026-08-14 20:04 JST・実運用 deck）:
  # slide-timeline の面は SVG を 1 つも持たないが CSS の軸＋節点で図が成立していた。
  # よって主判定は「文字リストであること」（li・カード 3 件以上）の側に置き、
  # 視覚構造（SVG/canvas/D3/図 img/CSS の軸）を免責側に置く。判定できない面は
  # DC5 判定保留として分母から外し名指しする。分母は 3 つとも出力し、
  # 判定できた面 0 件は exit 2 で緑にしない。除外は面番号でなく**面の型**で決める。
  - { kind: script, ref: scripts/validate-diagram-coverage.py,      tier: core }
  - { kind: script, ref: scripts/validate-report-layout.js,         tier: core }
  - { kind: script, ref: scripts/validate-slide-layout.js,          tier: core }
  - { kind: script, ref: scripts/validate-slide-skeleton.py,        tier: core }
  - { kind: script, ref: scripts/validate-svg-diagram.py,           tier: core }

dependencies:
  # 本 DAG は skill→agent / command→skill の実呼出構造を全被覆する。
  # 循環検出は lint-dependency-direction.py が担う。plugin 自身の component/capability 正本は本 composition の capabilities[] と .claude-plugin/plugin.json entry_points (両者は validate-plugin-completeness.py が 1:1 照合)。
  # 各 agent の粒度別依存 (前提/後続・R1→R2→R3 連鎖) の正本は該当 skill の workflow-manifest.json resources[]。build 計画の被覆正本は plugin-plans/slide-report-generator/component-inventory.json (validate-plan-coverage.py が sweep)。
  # --- command → skill 構造エッジ (entry points) ---
  - { from: commands/slide-report-generate.md, to: skills/run-slide-report-generate, type: calls }
  - { from: commands/slide-report-generate.md, to: scripts/validate-output-mode.py,  type: calls }
  - { from: commands/slide-report-status.md,   to: skills/run-slide-report-generate, type: reads }
  # --- skill → agent 呼出 ---
  - { from: skills/run-slide-report-generate, to: agents/hearing-facilitator,       type: calls }
  - { from: skills/run-slide-report-generate, to: agents/structure-designer,        type: calls }
  - { from: skills/run-slide-report-generate, to: agents/report-structure-designer, type: calls }
  - { from: skills/run-slide-report-generate, to: agents/structure-validator,       type: calls }
  - { from: skills/run-slide-report-generate, to: agents/d3-diagram-designer,        type: calls }
  - { from: skills/run-slide-report-generate, to: agents/data-visualizer,           type: calls }
  - { from: skills/run-slide-report-generate, to: agents/html-generator,            type: calls }
  - { from: skills/run-slide-report-generate, to: agents/slide-renderer,            type: calls }
  - { from: skills/run-slide-report-generate, to: agents/report-composer,           type: calls }
  - { from: skills/run-slide-report-generate, to: agents/visual-strategist,         type: calls }
  - { from: skills/run-slide-report-generate, to: agents/ai-image-diagram-producer, type: calls }
  - { from: skills/run-slide-report-generate, to: agents/layout-optimizer,          type: calls }
  - { from: skills/run-slide-report-generate, to: agents/ui-quality-reviewer,       type: calls }
  - { from: skills/run-slide-report-generate, to: agents/deck-evaluator,            type: calls }
  - { from: skills/run-slide-report-generate, to: agents/report-quality-reviewer,   type: calls }
  - { from: skills/run-slide-report-modify,   to: agents/slide-report-modifier,     type: calls }
  - { from: skills/run-cross-deck-review,     to: agents/cross-deck-reviewer,       type: calls }
  # PostToolUse hook は最小 guard と利用者選択の additionalContext だけを返し、
  # semantic evaluator を自動起動しないため、hook→agent の架空 edge は宣言しない。

external_dependencies:
  harness-creator:
    version: ">=1.4.0 <2.0.0"
    relation: skill-feedback-ssot-provider
    required_entry_points: [run-skill-feedback]

eval_sinks:
  - EVALS.json
