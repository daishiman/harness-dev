<!--
  heatmap-golden.html — ゴールデン実例: ヒートマップ型 (slide 骨格)

  入力: heatmap-input.json
  骨格: assets/diagram-templates/diagram-skeleton-slide.html
  参照: references/diagram-extended.md §11.44 ヒートマップ型
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #3 / §D-4
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py --check-grid --strict heatmap-golden.html

  6 列 × 4 行 = 24 セル。セルは 120 × 72、間隔 8 (列 x = 160 / 288 / 416 / 544 / 672 / 800、
  行 y = 96 / 176 / 256 / 336)。行ラベル列は左 128 を確保してある。

  濃さは accent 1 色の不透明度 **3 段 (0.14 / 0.30 / 0.50)** だけで作る。
  多色スケール (青→黄→赤) を使わないのは、色相が変わると読者が「量の順」ではなく
  「種類の違い」を読み始めるためで、順序を語れるのは同一色相の濃淡だけである。

  以前はここに 5 段 (0.05 / 0.14 / 0.20 / 0.30 / 0.50) あった。撤去した。
  紙 (#F7F6F3) の上へ合成すると 0.05 と 0.14 は ΔE(CIEDE2000) = 4.69 で、
  **5 段と称しながら実際には隣同士が同じ濃さに見える組を含んでいた**。
  ヒートマップは濃淡そのものが量を語る図なので、これは装飾の粗ではなく
  **図の主題が成立していない**ことを意味する。段を寄せて閾値を下げるのではなく、
  段の数を減らして離した (隣り合う段はどこを取っても ΔE 9 以上)。
  濃度段は 3 段までという VGCONST_002 の上限とも、これで一致する。

  段を 3 つに減らした結果、昼の行は 6 セルとも最も薄い段に落ちる。
  これは丸めの失敗ではなく、昼が 3-12 件で第 1 段 (0-14) に収まりきるという事実である。
  行内の細かい差は**すべてのセルに書いた件数**が持っている。
  数字を書いてあるのは元々、濃淡だけに順位を担わせないためで
  (印刷・モノクロ・色覚特性のいずれでも順位が残る)、段を減らしたいま同じ仕掛けが
  「段の中の差」も担っている。
  accent の枠は最濃セル 1 つにしか置かない。濃淡が既に順位を語っているので、
  2 つ目の枠は情報を増やさずに焦点だけを散らす。
-->
