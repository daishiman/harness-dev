<!--
  gantt-golden.html — ゴールデン実例: ガントチャート (report 骨格)

  入力: gantt-input.json
  骨格: assets/diagram-templates/diagram-skeleton-report.html
  参照: references/diagram-comparison.md §11.8 ガントチャート
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #3 #19 / §D-4
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py --check-grid --strict gantt-golden.html
        python3 plugins/slide-report-generator/scripts/validate-report-visual.py [埋め込んだ report]

  §11.8 のコード例から落としたものが 3 つある。いずれも検査側へ寄せた判断である。
   ・box-shadow を伴う hover の scaleY 変形 → R9-14 (図解の影は常に 0)
   ・5 色のバー色 (bar-blue / bar-pink / …) → R9-11 と style-tokens §2。
     行の区別は位置と行名が既に担っているので、色を足すと焦点 1 本が埋もれる。
     ここでは通常のバーを muted 一色にし、accent は最後の 1 本だけに使う。
   ・rotate(45deg) のマイルストーン菱形 → 変形は使わず polygon で菱形を描く。
     §D-3 原則 1 が禁じているのは接続子の斜め線であって、記号の形ではない。

  viewBox は CANVAS の sm 段 (960x360)。横帯の型なので高さを md へ伸ばさない。
  タスク行は 5 本で §D-2 #19 の上限 10 本の半分に収めてある。

  情報契約 (references/diagram-information-contract.md §2.6) へ合わせて足したもの:
   ・列見出しを年込みの絶対時点へ (「4月」→「2026/4」)。相対の月だけでは突合できない
   ・依存線 4 本。先行バーの右端から縦→横→縦のエルボーで後続バーの頭へ入れる。
     経路はバーの下端と次のバーの間の余白だけを通し、バーの上には重ねない
   ・マイルストーン 2 点 (◆ + 名前 + 年込みの日付)。縦の破線がその時点を通す
   ・工程ごとの担当を行名の下へ (§2.6 担当)
   ・下端 1 行に軸・線種・凡例・出所をまとめた (I1 / I3 / I4)
  バーの区間は依存が読めるよう終了→開始で並べ直してある。元の区間は
  隣り合う 2 本が重なっていて、依存線を引くと後続が先行の途中から始まる
  ように見え、「時間順に並べただけ」との区別が付かなかった。
-->
<figure class="srg-diagram srg-diagram--report"
        data-diagram-id="f-gantt"
        data-figure-width="bleed">

  <svg viewBox="0 0 960 360"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="f-gantt-caption">

    <defs>
      <marker id="f-gantt-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--fg-muted, #6A6A68)"/>
      </marker>
      <marker id="f-gantt-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #141412)"/>
      </marker>
      <marker id="f-gantt-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #4B6681)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

          fill="#F7F6F3" stroke="#D5D4D1" stroke-width="1.25"/>

    <rect x="32" y="88" width="176" height="240" fill="#E1E6EA"/>

    <!-- 罫。見出しと本体を分ける 2 本だけ rule-solid -->

    <line x1="208" y1="48" x2="208" y2="328" stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25"/>
    <line x1="328" y1="48" x2="328" y2="328" stroke="#D5D4D1" stroke-width="1.25"/>
    <line x1="448" y1="48" x2="448" y2="328" stroke="#D5D4D1" stroke-width="1.25"/>
    <line x1="568" y1="48" x2="568" y2="328" stroke="#D5D4D1" stroke-width="1.25"/>
    <line x1="808" y1="48" x2="808" y2="328" stroke="#D5D4D1" stroke-width="1.25"/>
    <line x1="32" y1="136" x2="928" y2="136" stroke="#D5D4D1" stroke-width="1.25"/>
    <line x1="32" y1="184" x2="928" y2="184" stroke="#D5D4D1" stroke-width="1.25"/>

    <!-- マイルストーン 2 点。縦の破線がその時点を通し、◆ が頭を留める。
         688 は列の罫 1 本を兼ね、868 は 9 月の中日でどのバーとも交差しない -->
    <line x1="688" y1="48" x2="688" y2="328"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <polygon points="688,32 695,40 688,48 681,40" fill="var(--fg-muted, #6A6A68)"/>
    <text x="688" y="22" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">移行判定 2026/7/31</text>
    <line x1="868" y1="48" x2="868" y2="328"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <polygon points="868,32 875,40 868,48 861,40" fill="var(--fg-muted, #6A6A68)"/>
    <text x="868" y="22" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">本番稼働 2026/9/15</text>

    <!-- 見出し行 (年を含む絶対時点) -->
    <text x="48" y="72" font-size="14" fill="var(--fg-muted, #6A6A68)">工程 / 担当</text>
    <text x="268" y="72" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">2026/4</text>
    <text x="388" y="72" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">2026/5</text>
    <text x="508" y="72" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">2026/6</text>
    <text x="628" y="72" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">2026/7</text>
    <text x="748" y="72" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">2026/8</text>
    <text x="868" y="72" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">2026/9</text>

    <!-- タスク名と担当 -->
    <text x="48" y="108" font-size="14" fill="var(--fg, #141412)">要件定義</text>
    <text x="48" y="126" font-size="12" fill="var(--fg-muted, #6A6A68)">情報システム部</text>
    <text x="48" y="156" font-size="14" fill="var(--fg, #141412)">設計</text>
    <text x="48" y="174" font-size="12" fill="var(--fg-muted, #6A6A68)">ベンダー</text>
    <text x="48" y="204" font-size="14" fill="var(--fg, #141412)">実装</text>

    <text x="48" y="318" font-size="12" fill="var(--fg-muted, #6A6A68)">情シス + ベンダー</text>

    <!-- バー。高さ 24 で行の中央に置き、列の内側へ 4 の余白を残す。
         区間は先行の終了 → 後続の開始で並べる (重ねると依存線が読めない) -->
    <rect x="212" y="100" width="112" height="24" fill="var(--fg-muted, #6A6A68)"/>
    <rect x="332" y="148" width="112" height="24" fill="var(--fg-muted, #6A6A68)"/>
    <rect x="452" y="196" width="232" height="24" fill="var(--fg-muted, #6A6A68)"/>
    <rect x="692" y="244" width="112" height="24" fill="var(--fg-muted, #6A6A68)"/>

    <!-- 焦点は最後の 1 本だけ -->
    <rect x="812" y="292" width="52" height="24" fill="var(--sakura-pink, #141412)"/>

    <!-- 依存 4 本。先行バーの右端 (中央高) から横へ 12 出て、バーの無い列を
         まっすぐ下り、後続バーの頭へ入る。バーの上を通る区間は 1 つも無い -->
    <path d="M 324 112 H 336 V 148" fill="none"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25" marker-end="url(#f-gantt-arrow)"/>
    <path d="M 444 160 H 456 V 196" fill="none"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25" marker-end="url(#f-gantt-arrow)"/>
    <path d="M 684 208 H 696 V 244" fill="none"

    <path d="M 804 256 H 816 V 292" fill="none"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25" marker-end="url(#f-gantt-arrow)"/>

    <!-- 下端 1 行: 軸・線種・色・出所。図の外へ出さない (I1 / I3 / I4) -->
    <text x="32" y="348" font-size="12" fill="var(--fg-muted, #6A6A68)">横軸は暦月 (2026年度・確定計画)。矢印は先行→後続の依存。破線と◆は日程確定の期日。色は焦点の 1 本。</text>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="f-gantt-caption" class="srg-diagram__caption">
    <span class="srg-diagram__label">図 4</span>
    左の列を上から下へ読み、次に帯がどこで途切れるかを見てほしい。破線は日程を確定させる境目で、そこから先は開始日を動かせない。
  </figcaption>

</figure>
