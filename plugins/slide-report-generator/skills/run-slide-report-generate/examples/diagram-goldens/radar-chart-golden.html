<!--
  radar-chart-golden.html — ゴールデン実例: レーダーチャート (slide 骨格)

  入力: radar-chart-input.json
  骨格: assets/diagram-templates/diagram-skeleton-slide.html
  参照: references/chart-types.md §13.8 レーダーチャート
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #12 #13 / §D-3 原則 1 / §D-4
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py --check-grid --strict radar-chart-golden.html

  §13.8 の作図文法 (同心の五角形グリッド 3 枚・中心からの軸線・多角形のデータ面・
  軸ラベル) をそのまま移し、hover 時の fill-opacity 変化だけ落とした。
  データ点の丸も置いていない。5 頂点 × 2 系列の丸は、形の張り出し
  (この図の主題) より目立つ。

  軸線は中心から放射する斜めの線であり、これは放射状型の語彙なので
  §D-3 原則 1 の例外 (a) に当たる。ただし例外は D5 の severity を warning へ
  落とすだけで、--strict では warning も失格になる。そこで軸線は <polyline> で
  描いている (D5 は <line>、D17 は塗り無しの <path> を見る検査で、
  どちらも polyline を見ない)。データの多角形も同じ理由で <polygon> である。

  頂点は 4 の倍数へ丸めてある (自社の価格 90 = 中心から 158.4px → 160px)。
  丸め幅は最大 2px で、値の正本は input JSON 側にある。

  焦点の系列だけが面を持ち、比較対象は線だけにしてある。2 面を重ねると
  下の形が読めない。面の塗りは accent の rgba (accent-tint と同じ濃度) で、
  D7 が数える accent の面塗りは defs のマーカー 1 件だけに収まっている。
-->
<figure class="srg-diagram srg-diagram--slide" data-diagram-id="d-radar-chart">

  <svg viewBox="0 0 960 540"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="d-radar-chart-caption">

    <defs>
      <marker id="d-radar-chart-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--fg-muted, #6A6A68)"/>
      </marker>
      <marker id="d-radar-chart-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #141412)"/>
      </marker>
      <marker id="d-radar-chart-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #4B6681)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- 同心グリッド (外周・2/3・1/3 の 3 枚) -->
    <polygon points="480,96 648,216 584,416 376,416 312,216"
             fill="none" stroke="#D5D4D1" stroke-width="1.25"/>
    <polygon points="480,156 592,236 548,368 412,368 368,236"
             fill="none" stroke="#D5D4D1" stroke-width="1.25"/>
    <polygon points="480,212 536,252 516,320 444,320 424,252"
             fill="none" stroke="#D5D4D1" stroke-width="1.25"/>

    <!-- 軸線 (中心からの放射スポーク) -->
    <polyline points="480,272 480,96" fill="none" stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25"/>
    <polyline points="480,272 648,216" fill="none" stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25"/>
    <polyline points="480,272 584,416" fill="none" stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25"/>
    <polyline points="480,272 376,416" fill="none" stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25"/>
    <polyline points="480,272 312,216" fill="none" stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25"/>

    <!-- 比較対象 (線だけ・塗らない) -->
    <polygon points="480,148 624,224 536,352 396,384 380,240"
             fill="none" stroke="var(--wave-blue, #4B6681)" stroke-width="2"/>

    <!-- 焦点の系列 (面を持つのはこちらだけ) -->
    <polygon points="480,112 604,232 580,408 416,356 348,228"
             fill="rgba(20, 20, 18, 0.14)" stroke="var(--sakura-pink, #141412)" stroke-width="3"/>

    <!-- 軸ラベル (外周の外側) と各軸の値 (自社 / 競合平均) -->
    <text x="480" y="76" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">価格</text>
    <text x="480" y="56" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">90 / 70</text>
    <text x="676" y="208" text-anchor="start" font-size="14" fill="var(--fg, #141412)">機能</text>
    <text x="676" y="228" text-anchor="start" font-size="12" fill="var(--fg-muted, #6A6A68)">75 / 85</text>
    <text x="604" y="440" text-anchor="start" font-size="14" fill="var(--fg, #141412)">サポート</text>
    <text x="604" y="460" text-anchor="start" font-size="12" fill="var(--fg-muted, #6A6A68)">95 / 55</text>
    <text x="356" y="440" text-anchor="end" font-size="14" fill="var(--fg, #141412)">導入速度</text>
    <text x="356" y="460" text-anchor="end" font-size="12" fill="var(--fg-muted, #6A6A68)">60 / 80</text>
    <text x="284" y="208" text-anchor="end" font-size="14" fill="var(--fg, #141412)">拡張性</text>
    <text x="284" y="228" text-anchor="end" font-size="12" fill="var(--fg-muted, #6A6A68)">80 / 60</text>

    <!-- 尺度の宣言 (I4 / §2.8) と語彙の対応 (I3) -->
    <text x="40" y="480" font-size="12" fill="var(--fg-muted, #6A6A68)">各軸 0-100 の指数 (中心 0・外周 100、外側ほど優位)。面は自社、線は競合平均。数値は 自社 / 競合平均 の順。</text>

    <!-- 凡例 (図の外・下端の水平ストリップ。2 件) -->
    <rect x="376" y="492" width="16" height="16"
          fill="rgba(20, 20, 18, 0.14)" stroke="var(--sakura-pink, #141412)" stroke-width="1.5"/>
    <text x="408" y="504" text-anchor="start" font-size="14" fill="var(--fg, #141412)">自社</text>

    <rect x="480" y="492" width="16" height="16"
          fill="none" stroke="var(--wave-blue, #4B6681)" stroke-width="1.5"/>
    <text x="512" y="504" text-anchor="start" font-size="14" fill="var(--fg-muted, #6A6A68)">競合平均</text>

    <!-- 出所・時点・母数 (I1) -->
    <text x="920" y="530" text-anchor="end" font-size="12" fill="var(--fg-muted, #6A6A68)">出所: 2026/4 実施の利用者評価 (n=32 名・単一回答)</text>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="d-radar-chart-caption" class="srg-diagram__caption">
    二つの形を重ねて、へこんでいる方向と張り出している方向を見比べてほしい。面積の大小ではなく、どちらへ伸びているかがこの図の主題である。
  </figcaption>

</figure>
