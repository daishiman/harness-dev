<!--
  sequence-golden.html — ゴールデン実例: シーケンス図 (report 骨格)

  入力: sequence-input.json
  骨格: assets/diagram-templates/diagram-skeleton-report.html
  参照: references/diagram-technical.md §11.36 シーケンス図
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #1 #2 / §D-3 原則 2 / §D-4 / §D-5
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py --check-grid --strict sequence-golden.html
        python3 plugins/slide-report-generator/scripts/validate-report-visual.py [埋め込んだ report]

  §11.36 の幾何をそのまま使う (ヘッダ 192x64・ライフライン間 224・メッセージ行間 56・活性化帯 幅 8)。
  戻りと非同期だけを破線にし、実線は「呼んで待つ」に限る。
  焦点は活性化帯 1 本 (待ち時間の主語) で、ヘッダは全て同じ塗りにする。
-->
<figure class="srg-diagram srg-diagram--report"
        data-diagram-id="f-sequence"
        data-figure-width="text">

  <svg viewBox="0 0 960 540"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="f-sequence-caption">

    <defs>
      <marker id="f-sequence-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--fg-muted, #6A6A68)"/>
      </marker>
      <marker id="f-sequence-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #141412)"/>
      </marker>
      <marker id="f-sequence-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #4B6681)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- ライフライン (ヘッダ下端から下余白の手前まで。破線で「時間の軸」を表す) -->
    <line x1="144" y1="112" x2="144" y2="424" stroke="#D5D4D1" stroke-width="1.25" stroke-dasharray="4 3"/>
    <line x1="368" y1="112" x2="368" y2="424" stroke="#D5D4D1" stroke-width="1.25" stroke-dasharray="4 3"/>
    <line x1="592" y1="112" x2="592" y2="424" stroke="#D5D4D1" stroke-width="1.25" stroke-dasharray="4 3"/>
    <line x1="816" y1="112" x2="816" y2="424" stroke="#D5D4D1" stroke-width="1.25" stroke-dasharray="4 3"/>

    <!-- アクター (上端に横一列。塗りは全て同じで、順序だけが役割を語る) -->
    <rect x="48" y="48" width="192" height="64"
          fill="#F7F6F3" stroke="var(--fg, #141412)" stroke-width="1.5"/>
    <text x="144" y="86" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">利用者</text>
    <rect x="272" y="48" width="192" height="64"
          fill="#F7F6F3" stroke="var(--fg, #141412)" stroke-width="1.5"/>
    <text x="368" y="86" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">予約 API</text>
    <rect x="496" y="48" width="192" height="64"
          fill="#F7F6F3" stroke="var(--fg, #141412)" stroke-width="1.5"/>
    <text x="592" y="86" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">在庫サービス</text>
    <rect x="720" y="48" width="192" height="64"
          fill="#F7F6F3" stroke="var(--fg, #141412)" stroke-width="1.5"/>
    <text x="816" y="86" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">通知キュー</text>

    <!-- 活性化帯 (処理を抱えている区間。焦点はこの 1 本だけ) -->
    <rect x="140" y="152" width="8" height="240" fill="#F7F6F3" stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25"/>
    <rect x="364" y="152" width="8" height="240" fill="#F7F6F3" stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25"/>
    <rect x="588" y="208" width="8" height="72"
          fill="rgba(20, 20, 18, 0.14)" stroke="var(--sakura-pink, #141412)" stroke-width="2"/>

    <!-- メッセージ 1: 呼んで待つ (実線) -->
    <line x1="148" y1="160" x2="364" y2="160"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="2" marker-end="url(#f-sequence-arrow)"/>
    <text x="256" y="150" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">予約を申し込む</text>

    <!-- メッセージ 2: 呼んで待つ (実線) -->
    <line x1="372" y1="216" x2="588" y2="216"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="2" marker-end="url(#f-sequence-arrow)"/>
    <text x="480" y="206" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">在庫を確保する</text>

    <!-- メッセージ 3: 戻り (破線・同じ 2 者の間を逆向きに引く) -->
    <line x1="588" y1="272" x2="372" y2="272"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#f-sequence-arrow)"/>
    <text x="480" y="262" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">確保できた数量 (不足なら 0)</text>

    <!-- メッセージ 4: 非同期 (破線・外部呼び出しの色。ラベルがライフラインを跨ぐのでマスクを敷く) -->
    <line x1="372" y1="328" x2="812" y2="328"
          stroke="var(--wave-blue, #4B6681)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#f-sequence-arrow-link)"/>
    <rect x="536" y="304" width="120" height="20" fill="#F7F6F3"/>
    <text x="592" y="318" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">非同期で通知する</text>

    <!-- メッセージ 5: 戻り (破線) -->
    <line x1="364" y1="384" x2="148" y2="384"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#f-sequence-arrow)"/>
    <text x="256" y="374" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">予約番号を返す</text>
    <text x="256" y="404" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">不足時は予約を作らず受付拒否</text>

    <!-- 凡例 (使い分けている線種と色だけを図内で定義する) -->
    <text x="48" y="464" font-size="12" fill="var(--fg-muted, #6A6A68)">凡例  ── 実線 = 同期 (返事を待つ)   ---- 破線 = 戻り・非同期 (待たない)</text>
    <text x="48" y="488" font-size="12" fill="var(--fg-muted, #6A6A68)">青 = 外部サービス宛 / 桃色の帯 = 待ち時間を決める区間</text>

    <!-- 注釈 1 件 (図の余白部分のみ・矢じりは付けない) -->
    <text x="912" y="32" text-anchor="end" font-size="12" font-style="italic" fill="var(--fg-muted, #6A6A68)">この区間が全体の待ち時間を決める</text>
    <path d="M 704 36 Q 700 56 696 70" fill="none"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <circle cx="696" cy="72" r="2" fill="var(--fg-muted, #6A6A68)"/>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="f-sequence-caption" class="srg-diagram__caption">
    上から下へ時間が流れる。実線は相手の返事を待つ呼び出しで、破線は待たない。色の付いた帯の長さだけが、待たされる側の体感に直接効いている。
  </figcaption>

</figure>
