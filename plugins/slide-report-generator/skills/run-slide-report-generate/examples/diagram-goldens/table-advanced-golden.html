<!--
  table-advanced-golden.html — ゴールデン実例: 高度な表型 (report 骨格)

  入力: table-advanced-input.json
  骨格: assets/diagram-templates/diagram-skeleton-report.html
  参照: references/diagram-comparison.md §11.9 高度な表型
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #3 / §D-4 / §D-5
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py --check-grid --strict table-advanced-golden.html
        python3 plugins/slide-report-generator/scripts/validate-report-visual.py [埋め込んだ report]

  §11.9 のコード例から落としたものが 4 つある。いずれも検査側へ寄せた判断である。
   ・thead と進捗バーの linear-gradient → 面は単色で塗る。グラデーションは
     paper / paper-2 の 2 段という面の階層を 3 段目へ増やしてしまう
     (style-tokens §1 の paper-2 の使用制限)。
   ・4 色のステータスバッジ (success / warning / error / info) → 緑
     (#98BB6C) はそもそも palette に無く D10 が落とす。加えて行ごとに色を配ると
     §D-2 #3 の accent 上限 2 件を必ず超え、どの行を見るべきかを図が指さなくなる。
     バッジは面を paper-2 + soft 枠に統一し、区別は文字が担う。
   ・number-cell の 'JetBrains Mono' 指定 → R9-15 (書体は成果物の
     --font-base / --font-mono のみ) と D13。数値は右揃えで桁を揃えれば足りる。
   ・action-btn の hover scale と var(--bg-dark) → R9-14 (影・変形を持たない) と
     palette 外の色。読む図に操作の見た目は要らない。

  行の強調 (§11.9 の row-highlight) だけは残した。焦点 1 行を指す語彙として
  accent-tint の塗り + accent の枠がそのまま使えるためで、色は accent 1 色に絞ってある。
-->

    <!-- バッジの判定条件・列の定義・時点 (I1 / I3 / I4 / I-CMP)。
