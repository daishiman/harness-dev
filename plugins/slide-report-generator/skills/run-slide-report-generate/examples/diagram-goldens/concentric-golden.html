<!--
  concentric-golden.html — ゴールデン実例: コンセントリックサークル型 (slide 骨格)

  入力: concentric-input.json
  骨格: assets/diagram-templates/diagram-skeleton-slide.html
  参照: references/diagram-business.md §11.14 コンセントリックサークル型
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #3 / §D-2 #20 / §D-5
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py concentric-golden.html

  §11.14 のコード例はコアを linear-gradient で塗り、層ごとに別の有彩色の枠を持ち、
  hover で scale + box-shadow を掛ける。グラデーションはパレット (style-tokens §1) の
  外にあり、影は R9-14 で常に 0、hover 変形は静止面に存在しないので落とした。
  層の色分けもやめてある。3 層に 3 色を割り当てると読者は「3 つの並列な種別」と読むが、
  この図が語るのは入れ子の範囲であって種別ではない。塗りは ink の濃度 1 段ずつで
  深さを表し、有彩色は最内層の 1 つだけに残した (§D-2 #3)。
  凡例が語るのは色ではなく時期である。3 項目で §D-2 #20 の上限 5 の内側にある。
-->
<figure class="srg-diagram srg-diagram--slide" data-diagram-id="d-concentric">

      </marker>
    </defs>

    <circle cx="320" cy="272" r="224"

    <text x="608" y="168" font-size="12" fill="var(--fg, #141412)">凡例 — 色は時期・内側ほど先に着手</text>
