<!--
  line-chart-golden.html — ゴールデン実例: 折れ線グラフ (slide 骨格)

  入力: line-chart-input.json
  骨格: assets/diagram-templates/diagram-skeleton-slide.html
  参照: references/chart-types.md §13.4 折れ線グラフ
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #3 / §D-3 原則 1 / §D-4
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py --check-grid --strict line-chart-golden.html

  データ線は型の語彙なので斜めに走る。§D-3 原則 1 (斜め線禁止) が禁じているのは
  「ノード間を結ぶコネクタ」の斜めであって、量の推移そのものを形にした線ではない。
  そのため線は <polyline> で描く (D5 は <line>、D17 は矢じり付き/塗り無しの <path> を
  見る検査で、どちらも polyline を見ない)。この「型語彙を検査対象の要素で書かない」
  という書き分けが、契約と検査の両方を同時に満たす唯一の書き方である。

  §13.4 のコード例からは、点の hover 半径拡大 (r: 8) と面グラフの塗りを落とした。
  塗りは 2 系列が重なると下の線が読めなくなり、hover は印刷・PDF に残らない。
  データ点も全打ちせず終端 2 点だけに置いた。7 点 × 2 系列の丸は
  線の傾き (この図の主張) より目立ってしまう。

  値は 1 単位 3.2px で置き、点の y は 4 の倍数へ丸めてある (38 → 318.4 → 320)。
  丸め幅は最大 2px で、終端の値ラベルが実数を書いているため図と数値は矛盾しない。
-->
<figure class="srg-diagram srg-diagram--slide" data-diagram-id="d-line-chart">

  <svg viewBox="0 0 960 540"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="d-line-chart-caption">

    <defs>
      <marker id="d-line-chart-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--fg-dim, #54546d)"/>
      </marker>
      <marker id="d-line-chart-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #D27E99)"/>
      </marker>
      <marker id="d-line-chart-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #7E9CD8)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- 目盛線 (下地) -->
    <line x1="144" y1="360" x2="904" y2="360" stroke="#DCD7BA" stroke-width="1.25"/>
    <line x1="144" y1="280" x2="904" y2="280" stroke="#DCD7BA" stroke-width="1.25"/>
    <line x1="144" y1="200" x2="904" y2="200" stroke="#DCD7BA" stroke-width="1.25"/>
    <line x1="144" y1="120" x2="904" y2="120" stroke="#DCD7BA" stroke-width="1.25"/>

    <!-- 軸 -->
    <line x1="144" y1="440" x2="904" y2="440" stroke="var(--fuji-gray, #8a8980)" stroke-width="2"/>
    <line x1="144" y1="112" x2="144" y2="440" stroke="var(--fuji-gray, #8a8980)" stroke-width="2"/>

    <!-- 目盛ラベル -->
    <text x="132" y="444" text-anchor="end" font-size="12" fill="var(--fg-dim, #54546d)">0</text>
    <text x="132" y="364" text-anchor="end" font-size="12" fill="var(--fg-dim, #54546d)">25</text>
    <text x="132" y="284" text-anchor="end" font-size="12" fill="var(--fg-dim, #54546d)">50</text>
    <text x="132" y="204" text-anchor="end" font-size="12" fill="var(--fg-dim, #54546d)">75</text>
    <text x="132" y="124" text-anchor="end" font-size="12" fill="var(--fg-dim, #54546d)">100</text>
    <text x="144" y="96" text-anchor="start" font-size="12" fill="var(--fuji-gray, #8a8980)">縦軸 継続指数 (0 起点・目盛を切っていない)</text>

    <!-- 比較対象の線 (副コネクタと同じ線幅 2) -->
    <polyline points="160,312 280,304 400,296 520,300 640,288 760,292 880,284"
              fill="none" stroke="var(--wave-blue, #7E9CD8)" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 焦点の線 (主コネクタと同じ線幅 2.5。太さでも 1 段上に置く) -->
    <polyline points="160,320 280,300 400,272 520,244 640,216 760,192 880,164"
              fill="none" stroke="var(--sakura-pink, #D27E99)" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 終端の点と直付けラベル (凡例を作らず線の先で名乗らせる) -->
    <circle cx="880" cy="284" r="4" fill="var(--wave-blue, #7E9CD8)"/>
    <text x="896" y="280" text-anchor="start" font-size="14" fill="var(--fg, #43436c)">49</text>
    <text x="896" y="300" text-anchor="start" font-size="12" fill="var(--fuji-gray, #8a8980)">市場平均</text>

    <circle cx="880" cy="164" r="4" fill="var(--sakura-pink, #D27E99)"/>
    <text x="896" y="160" text-anchor="start" font-size="14" fill="var(--sakura-pink, #D27E99)">86</text>
    <text x="896" y="180" text-anchor="start" font-size="12" fill="var(--fg-dim, #54546d)">自社</text>

    <!-- カテゴリラベル (相対表記にしない。年を含む絶対時点で書く) -->
    <text x="160" y="464" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">2026/4</text>
    <text x="280" y="464" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">2026/5</text>
    <text x="400" y="464" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">2026/6</text>
    <text x="520" y="464" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">2026/7</text>
    <text x="640" y="464" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">2026/8</text>
    <text x="760" y="464" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">2026/9</text>
    <text x="880" y="464" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">2026/10</text>

    <!-- 出所・母数 / 記号の使い分け (下端 1 行。figcaption へ逃がさない) -->
    <text x="144" y="500" font-size="12" fill="var(--fuji-gray, #8a8980)">出所: 契約管理台帳の月次抽出・対象 312 社 (n=312)</text>
    <text x="904" y="500" text-anchor="end" font-size="12" fill="var(--fuji-gray, #8a8980)">実線 2 本はいずれも実測 (予測を含まない)</text>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="d-line-chart-caption" class="srg-diagram__caption">
    左端では二本の線がほぼ重なっている。そこから右へ目を送り、離れはじめる地点と、離れたあとの傾きの差を見てほしい。
  </figcaption>

</figure>
