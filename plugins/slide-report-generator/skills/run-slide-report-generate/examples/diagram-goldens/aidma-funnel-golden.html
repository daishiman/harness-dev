<!--
  aidma-funnel-golden.html — ゴールデン実例: AIDMA/ファネル型 (report 骨格)

  入力: aidma-funnel-input.json
  骨格: assets/diagram-templates/diagram-skeleton-report.html
  参照: references/diagram-business.md §11.17 AIDMA/ファネルフレームワーク型
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #3 / §D-4 / §D-5
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py aidma-funnel-golden.html
        python3 plugins/slide-report-generator/scripts/validate-report-visual.py [埋め込んだ report]

  §11.17 のコード例は 5 段に 5 色の border-left を割り当て、hover で
  scale + box-shadow を掛ける。影は R9-14 で常に 0 なので落とし、5 色も落とした。
  段の違いは順序であって種別ではないので、系列色を当てると
  「5 つの並列な系列」に読める (style-tokens §2 の使用制限 1)。

  格子は 15 個のセル矩形ではなく 3 本の帯 + 4 本の区切り線で組んである。
  セルを 15 個置くと、読者が数える単位が 15 になり、本当に数えてほしい
  「5 列」がその中に埋もれる (§D-2 #1 の考え方)。
  焦点の列だけを 1 枚の面で縦に貫き、そこが本文の接続点であることを示す。
-->
<figure class="srg-diagram srg-diagram--report"
        data-diagram-id="f-aidma-funnel"
        data-figure-width="text">

  <svg viewBox="0 0 960 360"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="f-aidma-funnel-caption">

    <defs>
      <marker id="f-aidma-funnel-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--fg-dim, #54546d)"/>
      </marker>
      <marker id="f-aidma-funnel-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #D27E99)"/>
      </marker>
      <marker id="f-aidma-funnel-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #7E9CD8)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- 3 本の帯 (面の階層は 2 段まで) -->
    <rect x="40" y="40" width="880" height="52" rx="6" fill="#F8F7F0"/>
    <rect x="40" y="112" width="880" height="52" rx="6" fill="#FFFFFF" stroke="#DCD7BA" stroke-width="1.25"/>
    <rect x="40" y="184" width="880" height="76" rx="6" fill="#F8F7F0"/>

    <!-- 焦点の列 (1 図 1 件・3 帯を縦に貫く) -->
    <rect x="744" y="40" width="176" height="220" rx="6"
          fill="rgba(210, 126, 153, 0.14)" stroke="var(--sakura-pink, #D27E99)" stroke-width="2"/>

    <!-- 列の区切り (すべて垂直) -->
    <line x1="216" y1="40" x2="216" y2="260" stroke="#DCD7BA" stroke-width="1.25"/>
    <line x1="392" y1="40" x2="392" y2="260" stroke="#DCD7BA" stroke-width="1.25"/>
    <line x1="568" y1="40" x2="568" y2="260" stroke="#DCD7BA" stroke-width="1.25"/>
    <line x1="744" y1="40" x2="744" y2="260" stroke="#DCD7BA" stroke-width="1.25"/>

    <!-- 第 1 列 -->
    <text x="128" y="72" text-anchor="middle" font-size="14" fill="var(--fuji-gray, #8a8980)">Attention</text>
    <text x="128" y="144" text-anchor="middle" font-size="16" fill="var(--fg, #43436c)">認知</text>
    <text x="128" y="212" text-anchor="middle" font-size="14" fill="var(--fg-dim, #54546d)">業界誌への寄稿</text>
    <text x="128" y="240" text-anchor="middle" font-size="14" fill="var(--fg, #43436c)">月400件が到達</text>

    <!-- 第 2 列 -->
    <text x="304" y="72" text-anchor="middle" font-size="14" fill="var(--fuji-gray, #8a8980)">Interest</text>
    <text x="304" y="144" text-anchor="middle" font-size="16" fill="var(--fg, #43436c)">興味</text>
    <text x="304" y="212" text-anchor="middle" font-size="14" fill="var(--fg-dim, #54546d)">事例ページの公開</text>
    <text x="304" y="240" text-anchor="middle" font-size="14" fill="var(--fg, #43436c)">月90件が閲覧</text>

    <!-- 第 3 列 -->
    <text x="480" y="72" text-anchor="middle" font-size="14" fill="var(--fuji-gray, #8a8980)">Desire</text>
    <text x="480" y="144" text-anchor="middle" font-size="16" fill="var(--fg, #43436c)">欲求</text>
    <text x="480" y="212" text-anchor="middle" font-size="14" fill="var(--fg-dim, #54546d)">無料の試算</text>
    <text x="480" y="240" text-anchor="middle" font-size="14" fill="var(--fg, #43436c)">月40件が試算</text>

    <!-- 第 4 列 -->
    <text x="656" y="72" text-anchor="middle" font-size="14" fill="var(--fuji-gray, #8a8980)">Memory</text>
    <text x="656" y="144" text-anchor="middle" font-size="16" fill="var(--fg, #43436c)">記憶</text>
    <text x="656" y="212" text-anchor="middle" font-size="14" fill="var(--fg-dim, #54546d)">導入事例の送付</text>
    <text x="656" y="240" text-anchor="middle" font-size="14" fill="var(--fg, #43436c)">月24件へ送付</text>

    <!-- 第 5 列 (焦点) -->
    <text x="832" y="72" text-anchor="middle" font-size="14" fill="var(--fuji-gray, #8a8980)">Action</text>
    <text x="832" y="144" text-anchor="middle" font-size="16" fill="var(--fg, #43436c)">行動</text>
    <text x="832" y="212" text-anchor="middle" font-size="14" fill="var(--fg-dim, #54546d)">見積と稟議の支援</text>
    <text x="832" y="240" text-anchor="middle" font-size="14" fill="var(--fg, #43436c)">月3件が発注</text>

    <!-- 段間の転換率 (§2.8: 落差が主題なのに暗算させない) -->
    <text x="216" y="284" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">→ 22.5%</text>
    <text x="392" y="284" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">→ 44.4%</text>
    <text x="568" y="284" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">→ 60.0%</text>
    <text x="744" y="284" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">→ 12.5%</text>

    <!-- 読み方 (I3 凡例 / I4 軸) と出所・母数 (I1) -->
    <text x="40" y="312" font-size="12" fill="var(--fg-dim, #54546d)">左から右へ段が進む。% は前段からの転換率。破線は注釈の指示線、色付きの列は本文が扱う段。</text>
    <text x="40" y="332" font-size="12" fill="var(--fuji-gray, #8a8980)">出所: 自社CRM 実測・2026/4-6 の月平均 (重複除外後)。起点の母数 = Attention 到達 400 件/月。</text>

    <!-- 注釈 1 件 (図の余白部分のみ・矢じりは付けない) -->
    <text x="920" y="316" text-anchor="end" font-size="12" font-style="italic" fill="var(--fuji-gray, #8a8980)">最後の一段だけ桁が違う</text>
    <path d="M 780 306 Q 800 292 832 272" fill="none"
          stroke="var(--fuji-gray, #8a8980)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <circle cx="832" cy="272" r="2" fill="var(--fuji-gray, #8a8980)"/>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="f-aidma-funnel-caption" class="srg-diagram__caption">
    <span class="srg-diagram__label">図 1</span>
    五つの列を左から右へ、上下三行を一組として読んでほしい。数字は一つ前の段からどれだけ残ったかを示し、最後の一段だけ桁が変わる。
  </figcaption>

</figure>
