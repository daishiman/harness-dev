<!--
  clock-chart-golden.html — ゴールデン実例: 時計型円グラフ (slide 骨格)

  入力: clock-chart-input.json
  骨格: assets/diagram-templates/diagram-skeleton-slide.html
  参照: references/chart-types.md §13.6 時計型円グラフ
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #3 / §D-2 #20 / §D-4
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py --check-grid --strict clock-chart-golden.html

  §13.6 の作図文法 (0 時を上に置き 24 時間を一周させる・中心穴・4 つの時刻マーカー・
  区分ごとの所要時間を添えた凡例) をそのまま移した。落としたのは conic-gradient と
  hover 時の scale、そして凡例の Font Awesome アイコン (D8: SVG 内に PUA を置かない)。

  §13.6 は「朝活」に bg-dim (#F5F5F5) を当てているが、これはパレット外の色であり
  白地の上ではほぼ見えない。5 区分は色でしか区別できない型なので、
  ここは系列色 5 色を使い切る形へ寄せた (style-tokens §2 の 1 条が許す型である)。

  焦点は 6 色目を足さずに作る。series-3 は accent と同値なので、
  焦点の区分へ series-3 を割り当てれば系列色と焦点色が同じ 1 色で両立する
  (style-tokens §2 の 4 条「系列色と焦点色を同一図で混ぜない」の満たし方)。
  凡例の焦点だけは NODE_STYLES.focal (accent-tint の塗り + accent の枠) にしてある。
  D7 は defs の accent マーカーも面塗り 1 件として数えるので、
  骨格を保ったまま本体で使える accent の塗りは 1 件だけである。
-->
<figure class="srg-diagram srg-diagram--slide" data-diagram-id="d-clock-chart">

  <svg viewBox="0 0 960 540"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="d-clock-chart-caption">

    <defs>
      <marker id="d-clock-chart-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--fg-dim, #54546d)"/>
      </marker>
      <marker id="d-clock-chart-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #D27E99)"/>
      </marker>
      <marker id="d-clock-chart-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #7E9CD8)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- 0-7時 -->
    <path d="M 400 112 A 160 160 0 0 1 556 312 L 484 296 A 88 88 0 0 0 400 184 Z"
          fill="var(--wave-blue, #7E9CD8)" stroke="#FFFFFF" stroke-width="2"/>
    <!-- 7-9時 -->
    <path d="M 556 312 A 160 160 0 0 1 512 384 L 464 336 A 88 88 0 0 0 484 296 Z"
          fill="var(--spring-violet, #957FB8)" stroke="#FFFFFF" stroke-width="2"/>
    <!-- 9-17時 (焦点) -->
    <path d="M 512 384 A 160 160 0 0 1 244 312 L 316 296 A 88 88 0 0 0 464 336 Z"
          fill="var(--sakura-pink, #D27E99)" stroke="#FFFFFF" stroke-width="2"/>
    <!-- 17-20時 -->
    <path d="M 244 312 A 160 160 0 0 1 260 192 L 324 228 A 88 88 0 0 0 316 296 Z"
          fill="var(--wave-aqua, #7FB4CA)" stroke="#FFFFFF" stroke-width="2"/>
    <!-- 20-24時 -->
    <path d="M 260 192 A 160 160 0 0 1 400 112 L 400 184 A 88 88 0 0 0 324 228 Z"
          fill="var(--autumn-yellow, #DCA561)" stroke="#FFFFFF" stroke-width="2"/>

    <!-- 中心穴の中身 (周期。区分の名前は繰り返さない) -->
    <text x="400" y="268" text-anchor="middle" font-size="16" fill="var(--fg, #43436c)">24時間</text>
    <text x="400" y="292" text-anchor="middle" font-size="12" fill="var(--fuji-gray, #8a8980)">1日の配分</text>

    <!-- 時刻マーカー (円の外・4 点のみ) -->
    <text x="400" y="88" text-anchor="middle" font-size="12" fill="var(--fuji-gray, #8a8980)">0時</text>
    <text x="584" y="276" text-anchor="start" font-size="12" fill="var(--fuji-gray, #8a8980)">6時</text>
    <text x="400" y="456" text-anchor="middle" font-size="12" fill="var(--fuji-gray, #8a8980)">12時</text>
    <text x="216" y="276" text-anchor="end" font-size="12" fill="var(--fuji-gray, #8a8980)">18時</text>

    <!-- 凡例 (図の外・右の縦ストリップ。5 件で上限ちょうど) -->
    <rect x="656" y="136" width="16" height="16" rx="4" fill="var(--wave-blue, #7E9CD8)"/>
    <text x="688" y="148" text-anchor="start" font-size="14" fill="var(--fg-dim, #54546d)">睡眠</text>
    <text x="928" y="148" text-anchor="end" font-size="12" fill="var(--fuji-gray, #8a8980)">7時間</text>

    <rect x="656" y="192" width="16" height="16" rx="4" fill="var(--spring-violet, #957FB8)"/>
    <text x="688" y="204" text-anchor="start" font-size="14" fill="var(--fg-dim, #54546d)">朝の準備</text>
    <text x="928" y="204" text-anchor="end" font-size="12" fill="var(--fuji-gray, #8a8980)">2時間</text>

    <rect x="656" y="248" width="16" height="16" rx="4"
          fill="rgba(210, 126, 153, 0.14)" stroke="var(--sakura-pink, #D27E99)" stroke-width="1.5"/>
    <text x="688" y="260" text-anchor="start" font-size="14" fill="var(--fg, #43436c)">商談・実務</text>
    <text x="928" y="260" text-anchor="end" font-size="12" fill="var(--fg-dim, #54546d)">8時間</text>

    <rect x="656" y="304" width="16" height="16" rx="4" fill="var(--wave-aqua, #7FB4CA)"/>
    <text x="688" y="316" text-anchor="start" font-size="14" fill="var(--fg-dim, #54546d)">移動・報告</text>
    <text x="928" y="316" text-anchor="end" font-size="12" fill="var(--fuji-gray, #8a8980)">3時間</text>

    <rect x="656" y="360" width="16" height="16" rx="4" fill="var(--autumn-yellow, #DCA561)"/>
    <text x="688" y="372" text-anchor="start" font-size="14" fill="var(--fg-dim, #54546d)">学習</text>
    <text x="928" y="372" text-anchor="end" font-size="12" fill="var(--fuji-gray, #8a8980)">4時間</text>

    <!-- 尺度の宣言 (I4 / §2.8) と出所・母数 (I1) -->
    <text x="40" y="490" font-size="12" fill="var(--fg-dim, #54546d)">上が起点の 0 時。時計回りに一周して 24 時間、扇の大きさは時間の長さ (1 時間 = 15 度)。</text>
    <text x="40" y="512" font-size="12" fill="var(--fuji-gray, #8a8980)">出所: 営業部 12 名の業務日誌 実測・2026/4-6 の稼働日平均 (n=744 人日・重複計上なし)。</text>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="d-clock-chart-caption" class="srg-diagram__caption">
    上を起点に時計回りで一日が一周する。区分の名前より先に、色の変わった一区分が円周のどれだけを占めているかを見てほしい。
  </figcaption>

</figure>
