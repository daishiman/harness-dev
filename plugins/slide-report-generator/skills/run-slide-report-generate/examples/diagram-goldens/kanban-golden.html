<!--
  kanban-golden.html — ゴールデン実例: カンバンボード型 (report 骨格)

  入力: kanban-input.json
  骨格: assets/diagram-templates/diagram-skeleton-report.html
  参照: references/diagram-extended.md §11.41 カンバンボード型
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #1 #3 / §D-4
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py --check-grid --strict kanban-golden.html

  列は 272 幅・列間 40 で 3 列 (32 / 344 / 656)。カードは列の内側 16 の位置に
  240 幅で積み、縦の間隔は 88 (カード高 72 + 16) で全列そろえてある。
  列ごとにカード高を変えないのは、高さの差が「重さの差」に読まれてしまうためである。

  色は 2 件の焦点だけが持つ。WIP 上限を超えている列の見出しと、超過を作っている
  1 枚である。カードの重要度や担当者で色を分けない (色を分けた瞬間、読者は
  「滞留」ではなく「色の意味」を読み始める)。
-->
<figure class="srg-diagram srg-diagram--report"
        data-diagram-id="f-kanban"
        data-figure-width="text">

  <svg viewBox="0 0 960 540"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="f-kanban-caption">

    <defs>
      <marker id="f-kanban-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">

        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #D27E99)"/>
      </marker>
      <marker id="f-kanban-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #7E9CD8)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- 列の面 (3 列とも同じ塗り。列で塗りを変えると進捗が色の話になる) -->

    <rect x="344" y="88" width="272" height="376" rx="8" fill="#F8F7F0"/>
    <rect x="656" y="88" width="272" height="376" rx="8" fill="#F8F7F0"/>

    <text x="304" y="64" text-anchor="end" font-size="12" fill="var(--fuji-gray, #8a8980)">上限なし・3 枚</text>
    <line x1="32" y1="76" x2="304" y2="76" stroke="#DCD7BA" stroke-width="1.25"/>

    <text x="344" y="64" font-size="16" fill="var(--fg, #43436c)">着手中</text>
    <text x="616" y="64" text-anchor="end" font-size="12" fill="var(--sakura-pink, #D27E99)">WIP 上限 2・3 枚</text>
    <line x1="344" y1="76" x2="616" y2="76" stroke="var(--sakura-pink, #D27E99)" stroke-width="2"/>

    <text x="656" y="64" font-size="16" fill="var(--fg, #43436c)">完了</text>
    <text x="928" y="64" text-anchor="end" font-size="12" fill="var(--fuji-gray, #8a8980)">2026/6 完了・2 枚</text>
    <line x1="656" y1="76" x2="928" y2="76" stroke="#DCD7BA" stroke-width="1.25"/>

    <g>
      <rect x="48" y="104" width="240" height="72" rx="6" fill="#FFFFFF" stroke="#DCD7BA" stroke-width="1.25"/>

      <text x="64" y="160" font-size="12" fill="var(--fuji-gray, #8a8980)">担当未定</text>
    </g>
    <g>
      <rect x="48" y="192" width="240" height="72" rx="6" fill="#FFFFFF" stroke="#DCD7BA" stroke-width="1.25"/>

      <text x="64" y="248" font-size="12" fill="var(--fuji-gray, #8a8980)">担当未定</text>
    </g>
    <g>
      <rect x="48" y="280" width="240" height="72" rx="6" fill="#FFFFFF" stroke="#DCD7BA" stroke-width="1.25"/>

      <rect x="360" y="104" width="240" height="72" rx="6" fill="#FFFFFF" stroke="#DCD7BA" stroke-width="1.25"/>

    <g>

      <text x="376" y="224" font-size="14" fill="var(--fg, #43436c)">一次回答テンプレ化</text>
      <text x="376" y="248" font-size="12" fill="var(--fuji-gray, #8a8980)">2 週目</text>
    </g>
    <g>
      <rect x="360" y="280" width="240" height="72" rx="6"
            fill="rgba(210, 126, 153, 0.14)" stroke="var(--sakura-pink, #D27E99)" stroke-width="2"/>
      <text x="376" y="312" font-size="14" fill="var(--fg, #43436c)">電話導線の見直し</text>
      <text x="376" y="336" font-size="12" fill="var(--fg-dim, #54546d)">5 週目・上限超過</text>
    </g>

    <!-- 完了の列 -->
    <g>
      <rect x="672" y="104" width="240" height="72" rx="6" fill="#FFFFFF" stroke="#DCD7BA" stroke-width="1.25"/>
      <text x="688" y="136" font-size="14" fill="var(--fg, #43436c)">問い合わせ台帳の統合</text>
      <text x="688" y="160" font-size="12" fill="var(--fuji-gray, #8a8980)">2026/6 完了</text>

    <g>
      <rect x="672" y="192" width="240" height="72" rx="6" fill="#FFFFFF" stroke="#DCD7BA" stroke-width="1.25"/>

      <text x="688" y="248" font-size="12" fill="var(--fuji-gray, #8a8980)">2026/6 完了</text>
    </g>

    <!-- 列の進行方向 (盤面の読む向きを 1 本だけ示す。カード間に線を引かない) -->
    <line x1="32" y1="496" x2="928" y2="496"
          stroke="var(--fg-dim, #54546d)" stroke-width="2" marker-end="url(#f-kanban-arrow)"/>
    <text x="480" y="488" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">左から右へ流れる</text>

    <!-- 完了の判定基準 (「完了」列に入れてよい条件) -->
    <text x="32" y="524" font-size="12" fill="var(--fuji-gray, #8a8980)">完了の定義: 手順書を更新し、次の担当へ引き継ぎ済み</text>

  </svg>

    三つの列を左から右へ数えてほしい。真ん中の列だけが決めた枚数を超えており、五週目に入った一枚がその原因になっている。

</figure>
