<!--
  ascent-golden.html — ゴールデン実例: 上昇型（成長・向上フロー・slide 骨格）

  入力: ascent-input.json
  骨格: assets/diagram-templates/diagram-skeleton-slide.html
  参照: references/diagram-cycle-flow.md §11.5 上昇型（SVG2: 成長・向上フロー）
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 / §D-3 原則 1 / §D-4 / §D-5
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py --check-grid --strict ascent-golden.html

  §11.5 のコード例からずらした点は 4 つで、いずれも検査側へ寄せた結果である。
    ・feDropShadow と feGaussianBlur のグロー filter を落とした (R9-14 影は常に 0)
    ・linearGradient の面塗りを一様な低不透明度の塗りへ置き換えた
      (style-tokens §5。量を連続的に読ませる型ではないのでグラデーションは要らない)
    ・ステップ丸の中の文字色 bg-dark を落とし、丸を白地 + ink の枠にした
      (パレット外の暗色を持ち込まない。D10)
    ・軸の終点 750 を 752 へ、丸の半径 28 を 20 へ寄せた (§D-1 4px グリッド)
  上昇線は Q だけで作る。始点と終点を直線で結ぶと斜めセグメントになり §D-3 原則 1 に触れる。
-->
<figure class="srg-diagram srg-diagram--slide" data-diagram-id="d-ascent">

  <svg viewBox="0 0 800 400"

       aria-labelledby="d-ascent-caption">

      <marker id="d-ascent-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">

      </marker>
      <marker id="d-ascent-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #4B6681)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- 上昇の下地 (曲線と 2 軸で閉じた面。L は垂直と水平の 2 本だけ) -->

    <line x1="80" y1="340" x2="752" y2="340"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="2"/>
    <line x1="80" y1="340" x2="80" y2="40"

    <!-- 軸の宣言 / 凡例 / 出所 (I1・I3・I4・I-CHART。figcaption へ逃がさない) -->
    <text x="84" y="28" font-size="12" fill="var(--fg-muted, #6A6A68)">縦軸 = 定型業務の内製化率 (%)・0 起点 / 最大 100</text>

    <path d="M 160 300 Q 244 292 320 264 Q 400 236 456 192 Q 528 136 600 88" fill="none"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="3"/>

    <text x="160" y="270" text-anchor="middle" font-size="12" fill="var(--fg, #141412)">13%</text>

    <!-- ステップ 2 -->
    <circle cx="320" cy="264" r="20" fill="#F7F6F3" stroke="var(--fg, #141412)" stroke-width="1.5"/>

    <text x="320" y="234" text-anchor="middle" font-size="12" fill="var(--fg, #141412)">25%</text>
    <text x="320" y="364" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">型を作る</text>
    <text x="320" y="382" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">2025/10</text>

    <text x="456" y="162" text-anchor="middle" font-size="12" fill="var(--fg, #141412)">49%</text>

    <text x="456" y="382" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">2026/4</text>

    <!-- ステップ 4 (焦点 1 件。曲線が立ち上がる位置と一致させる) -->
    <circle cx="600" cy="88" r="20" fill="rgba(20, 20, 18, 0.14)" stroke="var(--sakura-pink, #141412)" stroke-width="2"/>
    <text x="600" y="93" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">4</text>
    <text x="600" y="58" text-anchor="middle" font-size="12" fill="var(--fg, #141412)">84%</text>
    <text x="600" y="364" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">引き継げる</text>
    <text x="600" y="382" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">2026/10</text>

    <!-- 注釈 1 件 (イタリック + 破線リーダー + 半径 2 のドット・矢じりは付けない) -->
    <text x="104" y="88" font-size="12" font-style="italic" fill="var(--fg-muted, #6A6A68)">三段合計 +36pt ≒ 最終段 +35pt</text>
    <path d="M 296 92 Q 380 112 440 176" fill="none"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <circle cx="440" cy="176" r="2" fill="var(--fg-muted, #6A6A68)"/>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="d-ascent-caption" class="srg-diagram__caption">
    左下から右上へ順に追ってほしい。内製化率は 13% から 84% まで上がるが、伸びの内訳は 1→3 の三段合計で +36pt、3→4 の一段だけで +35pt である。最後の一段が全体の伸びのほぼ半分を占める、というのがこの図の要点である。
  </figcaption>
