<!--
  funnel-golden.html — ゴールデン実例: 購買ファネル型 (slide 骨格)

  入力: funnel-input.json
  骨格: assets/diagram-templates/diagram-skeleton-slide.html
  参照: references/diagram-visual.md §11.21 購買ファネル型
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #17 / §D-5
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py --check-grid --strict funnel-golden.html

  §11.21 の作図文法 (台形を 5 段積む・段ごとに 1 ラベル + 1 比率) だけを移植した。
  節のコード例は feDropShadow を全段に掛け、段ごとに系列 5 色を配っているが、
  影は R9-14 (常に 0)、系列色は style-tokens §2 の使用制限
  (色でしか区別できない図に限る) に触れるので、どちらも落としてある。
  ファネルの段は幅と位置が既に序列を語っているので、色は焦点の 1 段だけが持つ。
  幅の減り方は一定 (24 ずつ) にしてある。実比率どおりに細らせると最下段に文字が入らない。
-->
<figure class="srg-diagram srg-diagram--slide" data-diagram-id="d-funnel">

  <svg viewBox="0 0 480 496"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="d-funnel-caption">

    <defs>
      <marker id="d-funnel-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--fg-muted, #6A6A68)"/>
      </marker>
      <marker id="d-funnel-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #141412)"/>
      </marker>
      <marker id="d-funnel-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #4B6681)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- 第 1 段 (最も広い) -->
    <g>
      <polygon points="48,16 432,16 408,96 72,96"
               fill="#E1E6EA" stroke="#D5D4D1" stroke-width="1.25"/>
      <text x="240" y="52" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">資料請求</text>
      <text x="240" y="72" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">1,000件（母数 n）</text>
    </g>

    <!-- 第 2 段 -->
    <g>
      <polygon points="72,100 408,100 384,180 96,180"
               fill="#E1E6EA" stroke="#D5D4D1" stroke-width="1.25"/>
      <text x="240" y="136" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">初回商談</text>
      <text x="240" y="156" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">620件・前段比 62%</text>
    </g>

    <!-- 第 3 段 (焦点。比率が最も落ちた直後の段) -->
    <g>
      <polygon points="96,184 384,184 360,264 120,264"
               fill="rgba(20, 20, 18, 0.14)" stroke="var(--sakura-pink, #141412)" stroke-width="2"/>
      <text x="240" y="220" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">提案</text>
      <text x="240" y="240" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">180件・前段比 29%</text>
    </g>

    <!-- 第 4 段 -->
    <g>
      <polygon points="120,268 360,268 336,348 144,348"
               fill="#E1E6EA" stroke="#D5D4D1" stroke-width="1.25"/>
      <text x="240" y="304" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">稟議</text>
      <text x="240" y="324" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">96件・前段比 53%</text>
    </g>

    <!-- 第 5 段 (最下段・最も狭い) -->
    <g>
      <polygon points="144,352 336,352 312,432 168,432"
               fill="#E1E6EA" stroke="#D5D4D1" stroke-width="1.25"/>
      <text x="240" y="388" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">契約</text>
      <text x="240" y="408" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">48件・前段比 50%</text>
    </g>

    <!-- 注釈 1 件 (図の余白部分のみ・矢じりは付けない) -->
    <text x="472" y="372" text-anchor="end" font-size="12" font-style="italic" fill="var(--fg-muted, #6A6A68)">ここで半分以上が消える</text>
    <path d="M 424 356 Q 400 300 372 236" fill="none"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <circle cx="372" cy="236" r="2" fill="var(--fg-muted, #6A6A68)"/>

    <!-- 軸と記号の断り (I3 / I4) と集計定義 (I1)。figcaption へ逃がさない -->
    <text x="24" y="460" font-size="12" fill="var(--fg-muted, #6A6A68)">幅は件数に比例しない（一定に細らせている）。破線は注記の引き出し線</text>
    <text x="24" y="480" font-size="12" fill="var(--fg-muted, #6A6A68)">各段は初回到達日で計上・同一商談の重複は除外（2026/1-6 受付）</text>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="d-funnel-caption" class="srg-diagram__caption">
    上から順に幅が細るが、比率が最も大きく落ちるのは二段目と三段目の間である。色の付いた段の手前で何が起きているかを見てほしい。
  </figcaption>

</figure>
