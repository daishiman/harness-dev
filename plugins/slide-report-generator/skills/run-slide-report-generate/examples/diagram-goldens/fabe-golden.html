<!--
  fabe-golden.html — ゴールデン実例: FABE型 (report 骨格)

  入力: fabe-input.json
  骨格: assets/diagram-templates/diagram-skeleton-report.html
  参照: references/diagram-business.md §11.20 FABE型 / references/diagram-fabe.md 2. 横フロー型
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #3 / §D-3 / §D-5
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py fabe-golden.html
        python3 plugins/slide-report-generator/scripts/validate-report-visual.py [埋め込んだ report]

  diagram-fabe.md の 5 バリエーションのうち横フロー型を取った。report の
  読書フローは左から右へ進むので、4 段の順序をそのまま横帯に置ける (§D-4-4)。
  節のコード例が持つプログレスラインのアニメーション・段ごとの配色・
  Font Awesome アイコンは落としてある。動きは静止面に無く、配色は 4 種別を
  暗示し (§D-2 #3)、PUA コードは <text> へ書けない (D8)。

  焦点は証拠の 1 枚。F / A / B の三枚は語り手の側の主張で、
  読者が自分で確かめられるのは E だけである。そこを本文の接続点にした。
-->
<figure class="srg-diagram srg-diagram--report"
        data-diagram-id="f-fabe"
        data-figure-width="text">

  <svg viewBox="0 0 960 360"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="f-fabe-caption">

    <defs>
      <marker id="f-fabe-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--fg-muted, #6A6A68)"/>
      </marker>
      <marker id="f-fabe-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #141412)"/>
      </marker>
      <marker id="f-fabe-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #4B6681)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- コネクタ 3 本 (水平・宛先の左辺へ右向きに入射) -->
    <line x1="236" y1="164" x2="260" y2="164"

    <line x1="468" y1="164" x2="492" y2="164"

    <line x1="700" y1="164" x2="724" y2="164"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="3" marker-end="url(#f-fabe-arrow)"/>

    <!-- 特徴 -->
    <rect x="32" y="64" width="200" height="200" fill="#E1E6EA"/>
    <text x="132" y="104" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">特徴</text>
    <text x="132" y="152" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">日次で照合する</text>
    <text x="132" y="196" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">取り込んだ直後に</text>
    <text x="132" y="224" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">全件を突き合わせる</text>
    <text x="132" y="250" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">経理部が2026/7から</text>

    <!-- 利点 -->
    <rect x="264" y="64" width="200" height="200" fill="#E1E6EA"/>
    <text x="364" y="104" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">利点</text>
    <text x="364" y="152" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">締めを待たない</text>
    <text x="364" y="196" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">差分がその日に</text>
    <text x="364" y="224" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">表へ出てくる</text>

    <!-- 便益 -->
    <rect x="496" y="64" width="200" height="200" fill="#E1E6EA"/>
    <text x="596" y="104" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">便益</text>
    <text x="596" y="152" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">翌月へ残らない</text>
    <text x="596" y="196" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">経理の残業が</text>
    <text x="596" y="224" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">月末に偏らない</text>

    <!-- 証拠 (焦点・1 図 1 件) -->
    <rect x="728" y="64" width="200" height="200"
          fill="rgba(20, 20, 18, 0.14)" stroke="var(--sakura-pink, #141412)" stroke-width="2"/>
    <text x="828" y="104" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">証拠</text>
    <text x="828" y="152" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">四社で同じ結果</text>
    <text x="828" y="196" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">工数は平均82%減</text>
    <text x="828" y="224" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">持ち越しはゼロ件</text>

    <!-- 証拠の出所・時点・件数・ばらつき (Evidence が言い換えに落ちないための下限) -->
    <text x="928" y="328" text-anchor="end" font-size="12" fill="var(--fg-muted, #6A6A68)">出典: 2025/4〜2026/3 の実測・4社12現場 (削減幅は68〜91%)</text>

    <!-- 注釈 1 件 (図の余白部分のみ・矢じりは付けない) -->
    <text x="32" y="328" font-size="12" font-style="italic" fill="var(--fg-muted, #6A6A68)">色は証拠の一枚だけ・そこが決め手</text>
    <path d="M 288 320 Q 500 312 724 280" fill="none"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <circle cx="724" cy="280" r="2" fill="var(--fg-muted, #6A6A68)"/>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="f-fabe-caption" class="srg-diagram__caption">
    <span class="srg-diagram__label">図 1</span>
    左から右へ、四枚を一続きの説明として読んでほしい。前の三枚は理屈であり、最後の一枚だけが相手の側で検証できる事実である。
  </figcaption>

</figure>
