<!--
  nested-golden.html — ゴールデン実例: 包含型 (report 骨格)

  入力: nested-input.json
  骨格: assets/diagram-templates/diagram-skeleton-report.html
  参照: references/diagram-visual.md §11.33 包含型
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #9 / §D-4 / §D-5
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py nested-golden.html
        python3 plugins/slide-report-generator/scripts/validate-report-visual.py [埋め込んだ report]

  §11.33 の幾何をそのまま使う (インセットは全層で横 32 / 縦 36・角丸は全層 8)。
  枠線は外側ほど薄く内側ほど濃く、塗りは既存の濃度 4 段だけを使い、
  最内層だけを焦点の塗りにする。層ラベルは枠の左上で、下にマスクを敷いて枠線を切る。
-->
<figure class="srg-diagram srg-diagram--report"
        data-diagram-id="f-nested"
        data-figure-width="text">

  <svg viewBox="0 0 640 400"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="f-nested-caption">

    <defs>
      <marker id="f-nested-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--fg-dim, #54546d)"/>
      </marker>
      <marker id="f-nested-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #D27E99)"/>
      </marker>
      <marker id="f-nested-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #7E9CD8)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- 第 1 層 (最も外・最も広い範囲) -->
    <rect x="16" y="16" width="608" height="368" rx="8"
          fill="rgba(67, 67, 108, 0.02)" stroke="rgba(67, 67, 108, 0.30)" stroke-width="1.5"/>
    <rect x="40" y="8" width="88" height="16" fill="#FFFFFF"/>
    <text x="48" y="20" font-size="12" fill="var(--fg-dim, #54546d)">全社ポリシー</text>

    <!-- 第 2 層 -->
    <rect x="48" y="52" width="544" height="296" rx="8"
          fill="rgba(67, 67, 108, 0.03)" stroke="var(--fuji-gray, #8a8980)" stroke-width="1.5"/>
    <rect x="72" y="44" width="112" height="16" fill="#FFFFFF"/>
    <text x="80" y="56" font-size="12" fill="var(--fg-dim, #54546d)">事業部の運用基準</text>

    <!-- 第 3 層 -->
    <rect x="80" y="88" width="480" height="224" rx="8"
          fill="rgba(67, 67, 108, 0.05)" stroke="var(--fg, #43436c)" stroke-width="1.5"/>
    <rect x="104" y="80" width="112" height="16" fill="#FFFFFF"/>
    <text x="112" y="92" font-size="12" fill="var(--fg-dim, #54546d)">チームの実装規約</text>

    <!-- 第 4 層 (最内・焦点。accent は最内層 1 つのみ) -->
    <rect x="112" y="124" width="416" height="152" rx="8"
          fill="rgba(210, 126, 153, 0.14)" stroke="var(--sakura-pink, #D27E99)" stroke-width="2"/>
    <text x="320" y="188" text-anchor="middle" font-size="16" fill="var(--fg, #43436c)">レビュー時の判断</text>
    <text x="320" y="216" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">変えられるのはここだけ</text>

    <!-- 序列の軸 (I4) と線・枠の意味 (I3 / I-STRUCT) -->
    <text x="48" y="368" font-size="12" fill="var(--fg-dim, #54546d)">外側ほど決定主体が遠く、内側ほど裁量が狭い。包含は制約の継承。</text>
    <text x="424" y="368" font-size="12" fill="var(--fuji-gray, #8a8980)">破線は注釈の指示線。</text>

    <!-- 注釈 1 件 (図の余白部分のみ・矢じりは付けない) -->
    <text x="608" y="336" text-anchor="end" font-size="12" font-style="italic" fill="var(--fuji-gray, #8a8980)">外側は現場では動かせない</text>
    <path d="M 560 344 Q 520 360 468 276" fill="none"
          stroke="var(--fuji-gray, #8a8980)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <circle cx="468" cy="276" r="2" fill="var(--fuji-gray, #8a8980)"/>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="f-nested-caption" class="srg-diagram__caption">
    <span class="srg-diagram__label">図 1</span>
    外側の枠ほど決めた人が遠い。内側へ入るほど裁量が狭まるという順で読み、最後に色の付いた枠だけを見てほしい。
  </figcaption>

</figure>
