<!--
  point-cards-golden.html — ゴールデン実例: ポイントカード型 (slide 骨格)

  入力: point-cards-input.json
  骨格: assets/diagram-templates/diagram-skeleton-slide.html
  参照: references/diagram-business.md §11.13 ポイントカード型
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #3 / §D-4 / §D-5
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py point-cards-golden.html

  §11.13 のコード例は nth-child でカードごとに border-top の色を変え、
  hover で translateY + box-shadow を掛ける。影は R9-14 で常に 0 なので落とし、
  4 色の色分けもやめた。色が違うだけで意味が違わないなら、それは「4 つの主張がある」
  という誤った合図になる (§D-2 #3 / §D-4 R9-11)。
  順序は色ではなく通し番号が語り、有彩色は焦点の 1 枚にだけ残している。
  §11.13 の Font Awesome アイコン円は数字へ置き換えた (SVG の <text> へ PUA を
  書かない・D8)。
-->
<figure class="srg-diagram srg-diagram--slide" data-diagram-id="d-point-cards">

  <svg viewBox="0 0 960 540"
       xmlns="http://www.w3.org/2000/svg"

       aria-labelledby="d-point-cards-caption">

    <defs>
      <marker id="d-point-cards-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">

      </marker>
      <marker id="d-point-cards-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #141412)"/>
      </marker>
      <marker id="d-point-cards-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #4B6681)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- カード 1 -->
    <rect x="40" y="136" width="272" height="280" fill="#E1E6EA"/>

    <text x="176" y="272" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">並行稼働で切り替える</text>
    <text x="176" y="308" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">現行を止めずに二か月</text>
    <text x="176" y="336" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">同じ数字を突き合わせる</text>

    <!-- カード 2 (焦点・1 図 1 件) -->
    <rect x="344" y="136" width="272" height="280"
          fill="rgba(20, 20, 18, 0.14)" stroke="var(--sakura-pink, #141412)" stroke-width="2"/>
    <rect x="344" y="136" width="272" height="4" fill="var(--sakura-pink, #141412)"/>
    <circle cx="480" cy="196" r="28" fill="#F7F6F3" stroke="var(--sakura-pink, #141412)" stroke-width="1.5"/>
    <text x="480" y="201" text-anchor="middle" font-size="14" fill="var(--fg, #141412)">02</text>
    <text x="480" y="272" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">差分は当日返す</text>
    <text x="480" y="308" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">取り込んだ直後に照合し</text>
    <text x="480" y="336" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">原因の候補まで添える</text>

    <!-- カード 3 -->
    <rect x="648" y="136" width="272" height="280" fill="#E1E6EA"/>
    <rect x="648" y="136" width="272" height="4" fill="var(--fg-muted, #6A6A68)"/>
    <circle cx="784" cy="196" r="28" fill="#F7F6F3" stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25"/>
    <text x="784" y="201" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">03</text>
    <text x="784" y="272" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">手順を残して渡す</text>
    <text x="784" y="308" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">操作記録が手順書になり</text>
    <text x="784" y="336" text-anchor="middle" font-size="14" fill="var(--fg-muted, #6A6A68)">担当交代でも続けられる</text>

    <!-- 注釈 1 件 (図の余白部分のみ・矢じりは付けない) -->

    <path d="M 184 464 Q 340 456 480 420" fill="none"

    <circle cx="480" cy="420" r="2" fill="var(--fg-muted, #6A6A68)"/>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="d-point-cards-caption" class="srg-diagram__caption">
    三枚を左から順に読み、二枚目で一度止まってほしい。並んではいるが対等ではなく、色の付いた一枚だけが今日の判断に関わる。
  </figcaption>

</figure>
