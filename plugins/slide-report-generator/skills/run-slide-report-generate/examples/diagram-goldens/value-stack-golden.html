<!--
  value-stack-golden.html — ゴールデン実例: 価値スタック型 (slide 骨格)

  入力: value-stack-input.json
  骨格: assets/diagram-templates/diagram-skeleton-slide.html
  参照: references/diagram-business.md §11.16 価値スタック型
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #3 / §D-2 #16 / §D-3 / §D-5
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py value-stack-golden.html

  §11.16 のコード例は nth-child で段ごとに border-left の色を変え、
  hover で translateX + box-shadow を掛ける。影は R9-14 で常に 0 なので落とし、
  4 色の段分けもやめた。段の序列を語っているのは位置 (どちらが上か) であって色ではなく、
  4 色を当てると 4 つの並列な種別に読める (§D-2 #3)。
  4 段は §D-2 #16 の上限 5 段の内側にある。矢印は上向きで、
  「下が終わって初めて上が載る」という順序をそのまま向きにしている。
-->
<figure class="srg-diagram srg-diagram--slide" data-diagram-id="d-value-stack">

  <svg viewBox="0 0 960 540"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="d-value-stack-caption">

    <defs>
      <marker id="d-value-stack-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--fg-dim, #54546d)"/>
      </marker>
      <marker id="d-value-stack-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #D27E99)"/>
      </marker>
      <marker id="d-value-stack-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #7E9CD8)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- 序列の軸・矢印の意味・色の使い分け -->
    <text x="160" y="36" font-size="12" fill="var(--fuji-gray, #8a8980)">上ほど後に載る・矢印は依存 (下が終わって初めて上)・色はいま着手中の段だけ</text>

    <!-- 段のあいだの矢印 3 本 (すべて垂直・上向き) -->
    <line x1="480" y1="416" x2="480" y2="388"
          stroke="var(--fg-dim, #54546d)" stroke-width="2" marker-end="url(#d-value-stack-arrow)"/>
    <line x1="480" y1="296" x2="480" y2="268"
          stroke="var(--fg-dim, #54546d)" stroke-width="2" marker-end="url(#d-value-stack-arrow)"/>
    <line x1="480" y1="176" x2="480" y2="148"
          stroke="var(--fg-dim, #54546d)" stroke-width="2" marker-end="url(#d-value-stack-arrow)"/>

    <!-- 第 4 段 (最上・最後に載る) -->
    <rect x="160" y="56" width="640" height="88" rx="6" fill="#F8F7F0"/>
    <rect x="160" y="56" width="8" height="88" fill="var(--fuji-gray, #8a8980)"/>
    <text x="200" y="96" font-size="16" fill="var(--fg, #43436c)">他部門へ移せる</text>
    <text x="200" y="124" font-size="14" fill="var(--fg-dim, #54546d)">手順が人から離れる</text>

    <!-- 第 3 段 -->
    <rect x="160" y="176" width="640" height="88" rx="6" fill="#F8F7F0"/>
    <rect x="160" y="176" width="8" height="88" fill="var(--fuji-gray, #8a8980)"/>
    <text x="200" y="216" font-size="16" fill="var(--fg, #43436c)">原因の見当がつく</text>
    <text x="200" y="244" font-size="14" fill="var(--fg-dim, #54546d)">調査の初動が短くなる</text>

    <!-- 第 2 段 (焦点・1 図 1 件) -->
    <rect x="160" y="296" width="640" height="88" rx="6"
          fill="rgba(210, 126, 153, 0.14)" stroke="var(--sakura-pink, #D27E99)" stroke-width="2"/>
    <rect x="160" y="296" width="8" height="88" fill="var(--sakura-pink, #D27E99)"/>
    <text x="200" y="336" font-size="16" fill="var(--fg, #43436c)">差分が当日出る</text>
    <text x="200" y="364" font-size="14" fill="var(--fg-dim, #54546d)">締めを待たずに気づける</text>

    <!-- 第 1 段 (最下・土台) -->
    <rect x="160" y="416" width="640" height="88" rx="6" fill="#F8F7F0"/>
    <rect x="160" y="416" width="8" height="88" fill="var(--fuji-gray, #8a8980)"/>
    <text x="200" y="456" font-size="16" fill="var(--fg, #43436c)">データが揃う</text>
    <text x="200" y="484" font-size="14" fill="var(--fg-dim, #54546d)">入力元と項目を一つに決める</text>

    <!-- 注釈 1 件 (図の余白部分のみ・矢じりは付けない) -->
    <text x="160" y="528" font-size="12" font-style="italic" fill="var(--fuji-gray, #8a8980)">下の段から順にしか積めない</text>
    <path d="M 328 520 Q 380 516 420 508" fill="none"
          stroke="var(--fuji-gray, #8a8980)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <circle cx="420" cy="508" r="2" fill="var(--fuji-gray, #8a8980)"/>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="d-value-stack-caption" class="srg-diagram__caption">
    下の段から上へ読み上げてほしい。上の段は下が終わって初めて載るもので、いま手を付けているのは下から二段目である。
  </figcaption>

</figure>
