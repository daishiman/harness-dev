<!--
  system-context-golden.html — ゴールデン実例: システムコンテキスト図 (slide 骨格)

  入力: system-context-input.json
  骨格: assets/diagram-templates/diagram-skeleton-slide.html
  参照: references/diagram-technical.md §11.40 システムコンテキスト図
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #1 #2 / §D-3 原則 1 / §D-4 / §D-5

  §11.40 の幾何をそのまま使う (中心 224x96・境界 288x160・外部アクター 176x80 を上下左右へ)。
  アクターを上下左右の 4 方向にだけ置くので、連携線はすべて軸に平行になる。
  外部呼び出しだけを link の色にし、人の操作は既定の色で引く。
-->
<figure class="srg-diagram srg-diagram--slide" data-diagram-id="d-system-context">

  <svg viewBox="0 0 960 540"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="d-system-context-caption">

    <defs>
      <marker id="d-system-context-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--fg-muted, #6A6A68)"/>
      </marker>
      <marker id="d-system-context-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #141412)"/>
      </marker>
      <marker id="d-system-context-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #4B6681)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- 責任境界 (器であってノードではない。破線 4,4 の境界語彙) -->
    <rect x="336" y="192" width="288" height="160"
          fill="rgba(20, 20, 18, 0.05)" stroke="rgba(20, 20, 18, 0.50)"
          stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="344" y="184" font-size="12" fill="var(--fg-muted, #6A6A68)">自チームの変更範囲</text>

    <!-- 連携 (上下左右の 4 方向のみ。すべて軸に平行) -->
    <line x1="480" y1="144" x2="480" y2="220"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="2" marker-end="url(#d-system-context-arrow)"/>
    <text x="492" y="188" font-size="12" fill="var(--fg, #141412)">予約を申し込む</text>
    <text x="492" y="206" font-size="12" fill="var(--fg-muted, #6A6A68)">同期 HTTPS・都度</text>
    <line x1="480" y1="400" x2="480" y2="324"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="2" marker-end="url(#d-system-context-arrow)"/>
    <text x="492" y="368" font-size="12" fill="var(--fg, #141412)">空き状況を更新</text>
    <text x="492" y="386" font-size="12" fill="var(--fg-muted, #6A6A68)">同期 HTTPS・都度</text>
    <line x1="368" y1="272" x2="248" y2="272"
          stroke="var(--wave-blue, #4B6681)" stroke-width="2" marker-end="url(#d-system-context-arrow-link)"/>
    <text x="300" y="260" text-anchor="middle" font-size="12" fill="var(--fg, #141412)">決済を依頼</text>
    <text x="300" y="290" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">同期 REST・都度</text>
    <line x1="592" y1="272" x2="712" y2="272"
          stroke="var(--wave-blue, #4B6681)" stroke-width="2" marker-end="url(#d-system-context-arrow-link)"/>
    <text x="660" y="260" text-anchor="middle" font-size="12" fill="var(--fg, #141412)">在庫を照会</text>
    <text x="660" y="290" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">同期 REST・都度</text>

    <!-- 中心システム (焦点。図の主語はこれ 1 つだけ) -->
    <rect x="368" y="224" width="224" height="96"
          fill="rgba(20, 20, 18, 0.14)" stroke="var(--sakura-pink, #141412)" stroke-width="2"/>
    <text x="480" y="268" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">予約管理システム</text>
    <text x="480" y="296" text-anchor="middle" font-size="12" fill="var(--fg-muted, #6A6A68)">予約と空き枠を持つ</text>

    <!-- 外部アクター (自分の管理外。塗りと枠を最も薄くする) -->
    <rect x="392" y="64" width="176" height="80"
          fill="rgba(20, 20, 18, 0.03)" stroke="rgba(20, 20, 18, 0.30)" stroke-width="1.5"/>
    <text x="480" y="112" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">利用者</text>
    <rect x="392" y="400" width="176" height="80"
          fill="rgba(20, 20, 18, 0.03)" stroke="rgba(20, 20, 18, 0.30)" stroke-width="1.5"/>
    <text x="480" y="448" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">店舗スタッフ</text>
    <rect x="64" y="232" width="176" height="80"
          fill="rgba(20, 20, 18, 0.03)" stroke="rgba(20, 20, 18, 0.30)" stroke-width="1.5"/>
    <text x="152" y="280" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">決済代行</text>
    <rect x="720" y="232" width="176" height="80"
          fill="rgba(20, 20, 18, 0.03)" stroke="rgba(20, 20, 18, 0.30)" stroke-width="1.5"/>
    <text x="808" y="280" text-anchor="middle" font-size="16" fill="var(--fg, #141412)">在庫マスタ</text>

    <!-- 注釈 1 件 (図の余白部分のみ・矢じりは付けない) -->
    <text x="912" y="512" text-anchor="end" font-size="12" font-style="italic" fill="var(--fg-muted, #6A6A68)">点線の外はこちらの都合では変えられない</text>
    <path d="M 856 500 Q 760 456 632 358" fill="none"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <circle cx="628" cy="356" r="2" fill="var(--fg-muted, #6A6A68)"/>

    <!-- 線の色 2 語彙の対応と、依存が切れたとき止まる範囲 (2.5 / I3) -->
    <text x="16" y="512" font-size="12" fill="var(--fg-muted, #6A6A68)">灰の実線=人の操作・青の実線=システム連携・破線=責任境界と注釈</text>
    <text x="16" y="530" font-size="12" fill="var(--fg-muted, #6A6A68)">決済代行が止まると新規予約の受付が止まる (空き照会だけは継続)</text>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="d-system-context-caption" class="srg-diagram__caption">
    まん中の一つだけがこちらの持ち物である。四方の箱は相手の都合で動くので、変更の話をするときは点線の内側だけを対象にしてほしい。
  </figcaption>

</figure>
