<!--
  er-golden.html — ゴールデン実例: ER 図 (report 骨格)

  入力: er-input.json
  骨格: assets/diagram-templates/diagram-skeleton-report.html
  参照: references/diagram-technical.md §11.35 ER 図
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #7 #8 / §D-4 / §D-5
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py --check-grid --strict er-golden.html
        python3 plugins/slide-report-generator/scripts/validate-report-visual.py [埋め込んだ report]

  §11.35 の幾何をそのまま使う (カード幅 256・見出し帯 44・フィールド行 32・列間 48)。
  カーディナリティは crow's foot を使わず 1 / N のテキストラベルで書く (斜辺を持たせない)。
  列名と型は技術リテラルなので等幅、エンティティ名は人が読む名前なので既定書体で組む。

  見出し帯の濃度は **0.14 (通常) と 0.30 (焦点)** の 2 段。
  以前は 0.05 と 0.14 だったが、この 2 つは紙 (#F7F6F3) の上へ合成すると
  ΔE(CIEDE2000) = 4.69 で、**2 通りの名前で呼び分けながら 1 つの見た目にしか
  落ちていなかった**。焦点のカードだけ帯を濃くしているつもりで、実際には
  3 枚とも同じ濃さの帯を持っていたことになる。
  α の語彙を 0.14 / 0.30 / 0.50 の 3 段へ揃えたので、隣り合う段はどこを取っても
  ΔE 9 以上離れる。**閾値のほうを下げて通す直し方は取らない**
  (通ることと読めることは別で、下げても帯は 1 つに見えたままになる)。
-->

      <marker id="f-er-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #4B6681)"/>
      </marker>
    </defs>

    <rect x="656" y="88" width="256" height="44" fill="rgba(20, 20, 18, 0.14)"/>

    <!-- 凡例 (使い分けている線種と色だけを図内で定義する) -->
    <text x="48" y="302" font-size="12" fill="var(--fg-muted, #6A6A68)">凡例  ── 参照関係 1対多 必須 (左端が 1・右端が N)</text>
    <!-- 凡例が「桃色の枠」と書いていたが、焦点の枠は ink (#141412) で桃色ではない。
         強調は色相でなく反転・濃度・線の太さで作る規約 (VGCONST_002) なので、
         図の中に色名が出てくること自体がこの図の作りと食い違っていた。
         実際に他と違うのは**枠の太さ (2px 対 1.5px) と帯の濃さ**なので、そう書く。 -->
    <text x="48" y="326" font-size="12" fill="var(--fg-muted, #6A6A68)">---- 注釈の指し線 / 太い枠と濃い帯 = 本文が論じる実体</text>

    <!-- 注釈 1 件 (図の余白部分のみ・矢じりは付けない) -->
    <text x="912" y="320" text-anchor="end" font-size="12" font-style="italic" fill="var(--fg-muted, #6A6A68)">主キーと論点に関わる列だけを残す</text>
    <path d="M 856 312 Q 828 296 792 280" fill="none"
          stroke="var(--fg-muted, #6A6A68)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <circle cx="792" cy="280" r="2" fill="var(--fg-muted, #6A6A68)"/>

  </svg>

  <figcaption id="f-er-caption" class="srg-diagram__caption">
    <span class="srg-diagram__label">図 1</span>
    中央の色が付いた箱から読み始めてほしい。左右の箱はそこへ何が結び付くかを示すだけで、議論の対象は中央の状態列だけである。
  </figcaption>

</figure>
