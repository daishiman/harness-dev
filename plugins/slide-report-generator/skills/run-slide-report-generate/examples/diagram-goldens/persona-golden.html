<!--
  persona-golden.html — ゴールデン実例: ペルソナ型 (report 骨格)

  入力: persona-input.json
  骨格: assets/diagram-templates/diagram-skeleton-report.html
  参照: references/diagram-comparison.md §11.10 ペルソナ型
  契約: references/diagram-layout-contract.md 第 4 次 update §D-1 / §D-2 #3 / §D-4 / §D-5
  検証: python3 plugins/slide-report-generator/scripts/validate-svg-diagram.py persona-golden.html
        python3 plugins/slide-report-generator/scripts/validate-report-visual.py [埋め込んだ report]

  §11.10 のコード例はアバターを linear-gradient で塗り、パネルごとに
  border-left の色を変えている。ここでは両方を落としてある。
  グラデーションはパレット (style-tokens §1) の外にあり、色分けした 3 本の
  border は「3 つの主張がある」と読める (§D-2 #3)。焦点は困りごとの 1 枠に絞り、
  他の 2 枠は rule の細帯で節の切れ目だけを示す。
-->
<figure class="srg-diagram srg-diagram--report"
        data-diagram-id="f-persona"
        data-figure-width="text">

  <svg viewBox="0 0 960 540"
       xmlns="http://www.w3.org/2000/svg"
       role="img"
       aria-labelledby="f-persona-caption">

    <defs>
      <marker id="f-persona-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--fg-dim, #54546d)"/>
      </marker>
      <marker id="f-persona-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--sakura-pink, #D27E99)"/>
      </marker>
      <marker id="f-persona-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <polygon points="0 0, 8 3, 0 6" fill="var(--wave-blue, #7E9CD8)"/>
      </marker>
    </defs>

    <!-- ===== EDIT: 図解本体 ここから ===== -->

    <!-- 人物像 (アバターは面 1 段 + 輪郭のみ。塗り分けで人格を語らせない) -->
    <circle cx="136" cy="136" r="64" fill="#F8F7F0" stroke="var(--fg, #43436c)" stroke-width="1.5"/>
    <circle cx="136" cy="116" r="20" fill="#FFFFFF" stroke="var(--fg-dim, #54546d)" stroke-width="1.5"/>
    <path d="M 104 172 A 32 32 0 0 1 168 172" fill="none"
          stroke="var(--fg-dim, #54546d)" stroke-width="1.5"/>
    <text x="136" y="240" text-anchor="middle" font-size="16" fill="var(--fg, #43436c)">経理課長</text>
    <text x="136" y="268" text-anchor="middle" font-size="12" fill="var(--fg-dim, #54546d)">中堅製造業・従業員300名</text>

    <!-- プロファイル 1 (背景) -->
    <rect x="288" y="48" width="640" height="136" rx="6" fill="#F8F7F0"/>
    <rect x="288" y="48" width="4" height="136" fill="#DCD7BA"/>
    <text x="316" y="88" font-size="16" fill="var(--fg, #43436c)">置かれている状況</text>
    <text x="316" y="124" font-size="14" fill="var(--fg-dim, #54546d)">月次決算は8営業日</text>
    <text x="624" y="124" font-size="14" fill="var(--fg-dim, #54546d)">経理は4名体制</text>
    <text x="316" y="160" font-size="14" fill="var(--fg-dim, #54546d)">会計システムは10年もの</text>
    <text x="624" y="160" font-size="14" fill="var(--fg-dim, #54546d)">決裁は月1回の役員会</text>

    <!-- プロファイル 2 (焦点・1 図 1 件) -->
    <rect x="288" y="208" width="640" height="136" rx="6"
          fill="rgba(210, 126, 153, 0.14)" stroke="var(--sakura-pink, #D27E99)" stroke-width="2"/>
    <rect x="288" y="208" width="4" height="136" fill="var(--sakura-pink, #D27E99)"/>
    <text x="316" y="248" font-size="16" fill="var(--fg, #43436c)">困っていること</text>
    <text x="316" y="284" font-size="14" fill="var(--fg-dim, #54546d)">締め日の直前に差分が出る</text>
    <text x="624" y="284" font-size="14" fill="var(--fg-dim, #54546d)">月に3〜5件</text>
    <text x="316" y="320" font-size="14" fill="var(--fg-dim, #54546d)">原因の追跡が1名に寄っている</text>
    <text x="624" y="320" font-size="14" fill="var(--fg-dim, #54546d)">1件あたり2時間</text>

    <!-- プロファイル 3 (背景) -->
    <rect x="288" y="368" width="640" height="136" rx="6" fill="#F8F7F0"/>
    <rect x="288" y="368" width="4" height="136" fill="#DCD7BA"/>
    <text x="316" y="408" font-size="16" fill="var(--fg, #43436c)">導入前に確かめること</text>
    <text x="316" y="444" font-size="14" fill="var(--fg-dim, #54546d)">既存の会計システムと繋がるか</text>
    <text x="624" y="444" font-size="14" fill="var(--fg-dim, #54546d)">判断は2026/6の役員会まで</text>
    <text x="316" y="480" font-size="14" fill="var(--fg-dim, #54546d)">担当が替わっても回るか</text>
    <text x="624" y="480" font-size="14" fill="var(--fg-dim, #54546d)">試用は2週間以内で</text>

    <!-- 注釈 1 件 (図の余白部分のみ・矢じりは付けない) -->
    <text x="32" y="356" font-size="12" font-style="italic" fill="var(--fuji-gray, #8a8980)">稟議は月に1度しか通せない</text>
    <path d="M 208 368 Q 248 388 284 412" fill="none"
          stroke="var(--fuji-gray, #8a8980)" stroke-width="1.25" stroke-dasharray="4 3"/>
    <circle cx="284" cy="412" r="2" fill="var(--fuji-gray, #8a8980)"/>

    <!-- 凡例と出所 (図の下端 1 行。I1 / I3 / §2.10 証拠) -->
    <text x="32" y="524" font-size="12" fill="var(--fuji-gray, #8a8980)">色は今回の提案で動かせる範囲。2026/2 に同業4社の経理課長へ聞き取り (n=4)</text>

    <!-- ===== EDIT: 図解本体 ここまで ===== -->

  </svg>

  <figcaption id="f-persona-caption" class="srg-diagram__caption">
    <span class="srg-diagram__label">図 1</span>
    左の人物像から読み始め、右の三つの枠を上から下へたどってほしい。真ん中の枠だけが、この提案で直接動かせる範囲である。
  </figcaption>

</figure>
