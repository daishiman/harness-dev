<!--
  layout-image-full.html — 全面画像
  生成物。手で編集しない。正本: scripts/build-slide-skeletons.py + assets/slide-templates/frame-contract.json
  再生成: python3 scripts/build-slide-skeletons.py

  ■ この面を選ぶとき
  Codex 生成画像を面いっぱいに置き、その上に短い題だけ重ねる。

  ■ 書き換えてよいのは次の 2 種類だけ
  1. `data-slot` を持つ要素の**中身** ({{...}} のプレースホルダ)。
     使えるスロット: title, note, media, page-no
  2. `data-media-slot` の中に置く差し込み物。
     この面が受け入れる種別: codex-image

  ■ 書き換えてはいけないもの (書き換えると面がズレる)
  - section / chrome / stage の class と構造、data-* 属性そのもの
  - 座標・寸法の直書き (面の数値は assets/slide-templates/frame-contract.json が単一の正本)
  - `.srg-slide__main` の `flex: 1 1 auto` (これが空白過多を止めている)
  - 画像の `object-fit`。contain 固定 (cover にすると端が切れる)

  ■ 文字が収まらないときの順序
  1. `data-autofit` を持つ要素は slide-skeleton.js が font-size を 18px まで下げる。
  2. 下限でなお溢れると data-overflow="true" が付く。これは表示であって修復ではない。
     **面を割る**か本文を削る。18px 未満へ縮めない。

  ■ 幾何 (すべて assets/slide-templates/frame-contract.json 由来)
  canvas 1280x720px / chrome top 48 bottom 56 side 64
  stage (64, 48) 1152x616px — 本文はこの矩形の外へ出さない
  印刷は A4 横。zoom 0.8769 で 297x167.06mm、
  上下 21.47mm がレターボックス帯。画面と PDF は同一物。
-->
<section class="srg-slide srg-slide--image-full"
         data-slide-skeleton="layout-image-full"
         data-media-kinds="codex-image"
         id="{{slide_id}}">

  <figure class="srg-media" data-slot="media" data-media-slot="background" style="margin: 0;">
    <!-- Codex 生成画像。object-fit は contain 固定 (cover にすると端が切れ、
         図中の文字や人物が欠ける)。alt は必ず内容を説明する文にする。 -->
    <picture class="ai-slide-canvas">
      <source srcset="{{image_webp}}" type="image/webp">
      <img src="{{image_png}}" alt="{{image_alt}}">
    </picture>
  </figure>
  <div class="srg-slide__stage">
    <div class="srg-slide__main" style="flex-direction: column; justify-content: flex-end;">
      <h2 class="srg-image-full__title" data-slot="title" data-autofit="title"
          style="font-size: var(--srg-fs-title); font-weight: 700; line-height: 1.3; margin: 0;
                 padding: var(--srg-gap); border-radius: var(--srg-radius);
                 background: var(--srg-scrim);">{{title}}</h2>
    </div>
    <p class="srg-slide__note" data-slot="note" data-autofit="note">{{credit}}</p>
  </div>
  <div class="srg-slide__chrome-bottom" data-chrome="page" data-slot="page-no">
    <span class="srg-nav__page" data-nav="page" style="margin-left: auto; font-size: var(--srg-fs-caption);">{{page_no}} / {{page_total}}</span>
  </div>
</section>
