# resource-map.yaml — 設計書06 第13条スキーマ準拠
# run-ubm-challenge の段階的開示（Progressive Disclosure）の索引。
# references/* は挑戦宣言と企画の対話 (C0-C6) と保存前後のゲートが参照する正本文書。
resources:
  - file: question-map.md
    topic: 対話の正本（欄とfieldの対応10種・原則5条・phase3 との差分の返し方・欄ごとの問いと切り口と北原レンズ ID・戻りゲート・ナレッジ未収録の扱い）
    read_when: C1-C5 で欄ごとに問いを出し深掘りするとき / challenge-advisor が返し方とレンズを決めるとき (最初に読む)
  - file: challenge-format.md
    topic: 出力フォーマットの正本（提出先に貼る骨格の文字列と順序・保存先のファイル名・各欄の合格条件・違反コード F01-N01）
    read_when: C6 で提出用本文を組み立てるとき / 欄の答えが足りているか (missing) を判定するとき / validate-challenge-output.py の違反コードを読むとき
  - file: handoff-format.md
    topic: 引き継ぎ契約（status 4値・confirmed/open_issues のキー・draft_path/saved_path・validation の受領書・completed の条件）
    read_when: 保留・中止で終えるとき / 完了状態を親コンテキストへ記録するとき
