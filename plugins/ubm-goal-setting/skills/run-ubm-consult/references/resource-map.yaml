# resource-map.yaml — 設計書06 第13条スキーマ準拠
# run-ubm-consult の段階的開示（Progressive Disclosure）の索引。
# references/* はコーチング型相談の各責務 (R1-R4) が参照する正本文書。
resources:
  - file: consult-frames.md
    topic: 思考フレームのカタログ (GF-xxx・ゴール指向分解/前提検証/トレードオフ二軸/因果深掘り/逆算/やらないこと設計/関係構築ファースト/フェーズ適合 と、対応する原則 PR-xxx・MS-xxx)
    read_when: R3-frame-consult で提示するフレームを選び出典を引くとき (最初に読む)
  - file: session-record-format.md
    topic: 相談セッション記録の契約（`outcome` の分岐ごとの必須項目・ユーザー主体性・保存同意・セッション分離）と引き継ぎファイル（handoff）のスキーマ・vault の外の置き場の契約
    read_when: R4-cocreate-converge で解決策と、選んだ締め方での締め (行動計画または再開条件) を記録するとき / OUT1 の4要素を検証するとき
