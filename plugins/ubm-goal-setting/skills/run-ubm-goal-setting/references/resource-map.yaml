# resource-map.yaml — 設計書06 第13条スキーマ準拠
# run-ubm-goal-setting の段階的開示（Progressive Disclosure）の索引。
# references/* は目標設定対話の各 Phase が参照する補助資料。
resources:
  - file: validation-gates.md
    topic: 決定論ゲートの入力パス・保存前後の順序・終了コード・IN3 の1年層の引数 (--yearly / --no-yearly) の正本
    read_when: Phase4-5 の下書き・層間検査・正式保存の前
  - file: output-formats.md
    topic: 1年目標/期報/月報/週報の統一ハイブリッド構造テンプレート (公式21ブロック・公式順) と共通部品A〜G の正本
    read_when: Phase4 で目標設定テンプレートへ整形するとき (最初に読む)
  - file: data-contract.md
    topic: エージェント間データ仕様 (Phase 間 I/O 定義・バリデーションルール)
    read_when: Phase 間でデータを受け渡すとき / validate-goal-output の公式21ブロック定義を確認するとき
  - file: selection-focus-goal-frame.md
    topic: 選択と集中フレーム (北原さん 2026-08-12 コメント由来。5要素チェック・1年/期報/月報/週報の期間別の落とし込み・ポジティブ事故ゲート・運用カレンダー)
    read_when: Phase3 Step3 で目標が1点に収束しているか検査するとき / Step4 で支出と期日を設計するとき
  - file: thinking-guide.md
    topic: 思考法統合ガイド (思考プロセス定義・実行パターン・質問テンプレート)
    read_when: Phase3 の対話で思考法を質問へ落とし込むとき
  - file: ../../../CHANGELOG.md
    topic: プラグインの版履歴 (統一ハイブリッド構造の変遷を含む。27.0.0 までのスキル版の旧履歴は凍結した version-history.md)
    read_when: 出力仕様の由来・変更経緯を確認するとき
