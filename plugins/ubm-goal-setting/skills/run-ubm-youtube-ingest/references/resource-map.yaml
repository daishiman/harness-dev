# resource-map.yaml — 設計書06 第13条スキーマ準拠
# run-ubm-youtube-ingest の段階的開示（Progressive Disclosure）の索引。
# references/* は YouTube 取込パイプラインの各責務 (R1-R4) が参照する正本文書。
resources:
  - file: provider-adapter-contract.md
    topic: YouTube の取得元に依存しない取得契約 (list_channel_videos/fetch_transcript・型付きのエラー・字幕から承認済み ASR への切り替え・取得元を後から差し込む方法・検証用の入力データのスキーマ)
    read_when: R2-fetch-normalize で取得のインターフェースとエラーの分類を確かめるとき / 実際の取得元を後から差し込むとき
  - file: registry-ledger-schema.md
    topic: youtube-registry.json のスキーマ (ソース登録簿/動画の状態の集合/実行権の占有（lease）/最終実行の記録（cursor）/照合台帳) と初期化手順
    read_when: R1-source-mode でソースの優先度を確定するとき / R4-sync-reconcile で照合台帳の状態を扱うとき
  - file: sync-report-format.md
    topic: 1回きりの実行が出す同期の報告の正本形式と、受入テストが照合する不変則 (OUT1)・終了コード
    read_when: R4-sync-reconcile で同期の報告を消費するとき / 冪等性・全量性を検証するとき
