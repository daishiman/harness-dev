# resource-map.yaml — 設計書06 第13条スキーマ準拠
# run-ubm-journal の Progressive Disclosure 索引。
# 日次ジャーナル生成の Phase ごとに「いつどれを開くか」を明示し、全部を先読みさせない。
resources:
  - file: output-format.md
    topic: 日次ジャーナルの骨格の正本 (見出し15ブロック (正本は validate-journal-output.py の REQUIRED_OUTLINE。増減時はそちらと同時に直す)・目標4階層・3ジャーナル×3小節・フェーズ別課題チェックシート)
    read_when: Phase4 で収集内容を Markdown へ整形するとき / Phase5 の違反コードの意味を確認するとき
  - file: interview-map.md
    topic: 自然な問い → ジャーナルのどのセクションに落ちるかの対応表。固定習慣6項目と週次習慣目標4群の引き出し方も含む
    read_when: Phase1-3 の対話を進めるとき (最初に読む) / 掘り下げが足りないと感じたとき
  - file: principle-checklist.md
    topic: 日次ジャーナル末尾に毎回出力する原理原則チェックシートの正本 (設問11件の見出し・テンプレ本体・出力ルール。K01/K02 の検査対象を定義する)
    read_when: Phase4-compose で末尾の原理原則チェックシートを組むとき (初回はテンプレをそのまま、2回目以降は前回のチェック状態を継承) / Phase5 で K01・K02 違反の対象設問を特定するとき。対話 (Phase1-3) では開かない
  - file: daily-habits.json
    topic: 毎日必ずヒアリングする固定習慣6項目の正本 (Gridノート・23時就寝・ストレッチ・計画外の動画視聴・ジャーナル・SNS投稿)
    read_when: Phase3 で未確認の固定習慣を束ねて聞くとき / H01・H02 違反の対象項目を特定するとき。項目を増減するときもこのファイルだけを編集する (keywords と search_scopes を必ず併記する。search_scopes 無しは H02 違反になる)
