external_dependencies:
  harness-creator:
    version: ">=1.4.0 <2.0.0"
    relation: skill-feedback-and-content-review-provider
    required_entry_points: [run-skill-feedback, assign-skill-design-evaluator]
  skill-governance-config:
    version: ">=0.1.0 <1.0.0"
    relation: content-review-rubric-registry
    required_entry_points: [run-governance-config]

