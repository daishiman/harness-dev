# CapabilityBundle 宣言 — plugins/ubm-goal-setting
# 正本スキーマ: ../harness-creator/skills/run-build-skill/references/capability-manifest.schema.json (kindPluginComposition)
# 用途: 北原さん式ゴールセッティングの目標設定・振り返り対話とナレッジ差分同期を担う plugin の自己記述。
#       ~/dev/dev/ObsidianMemo/.claude/skills/ubm-goal-setting/ の既存資産を faithful-transfer+adapt した移植 plugin。

name: ubm-goal-setting
description: 北原さん式ゴールセッティングの目標設定・振り返り対話 (capability A) とナレッジ差分同期 (capability B) を提供する移植 plugin。会話で作る日次ジャーナルと挑戦宣言と企画も同じ plugin で扱う。
kind: plugin-composition
version: 0.7.0
owner: harness-maintainers
since: 2026-07-04
last-audited: 2026-07-11

contract:
  intent: UBM (北原さん式ゴールセッティング) の目標設定・振り返り対話機能とナレッジ差分同期機能一式を、harness-creator の量産規律 (TDD/評価/goal-seek/feedback-contract) を継承した 1 plugin へ漏れなく移植し、会話で作る日次ジャーナルと挑戦宣言と企画を同じ規律で加える。
  interface:
    inputs: [目標種別(weekly|monthly|quarterly。bimonthlyは後方互換の別名), 過去目標, 合宿情報, ナレッジJSON, 対話回答, ナレッジソース(.md), ジャーナルの日付(YYYY-MM-DD), 挑戦の仮タイトル]
    outputs: [統一ハイブリッド構造の公式21ブロックの目標設定ファイル, Daily.md embed更新, knowledge/*.json更新, router.json/registry.json/sync-log.jsonl追記, 同期レポート, 日次ジャーナル(02_Configs/Daily/YYYY-MM-DD.md), 挑戦宣言と企画のファイル(05_Project/UBM/挑戦宣言/)と提出用テキスト]
  invariant:
    - 目標設定出力は統一ハイブリッド構造の公式21ブロックを満たし validate-goal-output.py の全チェックに PASS すること
    - 数値は半角のみ・差分は +/- 付き・行動目標は「誰に・何を・いつまで・何件」を含むこと
    - 「頑張る/意識する/気をつける」等の精神論は行動目標として不可 (具体化を要求)
    - 「やらないこと」3項目以上 + 判断基準1文で迷いを排除すること
    - capability A (goal-setting) と capability B (knowledge-sync) は knowledge/*.json を plugin-root 共有 SSOT (schema契約) として整合し、skill 間の実行時 depends_on は張らないこと
    - knowledge L1 curated (router が列挙する6カテゴリの分割JSON+router) は vendor 同梱シード / L2 raw vault は UBM_VAULT_ROOT で外部解決 / L3 bookkeeping (registry=実台帳/sync-log=空) は 親が承認済みの中央guard executeからplugin同梱knowledge/へ反映すること（抽出Taskは一時コピーだけを更新） (writeback-config という別機構は不要と build で確定)
    - 移植元 vault (~/dev/dev/ObsidianMemo) のノート/設定領域 (01_Notes/・02_Configs/ の許可外ファイル・03_Sources/・logs/・.obsidian/ 等) は読み取り専用ソースであり ubm-write-path-guard hook が許可範囲の正本 hooks/ubm-write-path-guard.py の ALLOWED_PREFIXES / ALLOWED_EXACT 以外の vault 書込を fail-closed で阻むこと。各 skill が実際に書く範囲はこれより狭く、その境界は各 skill の規則が守る。UBM_VAULT_ROOT 未設定時は検査しない
    - scripts は Python 標準ライブラリのみ (旧 .sh 3本の契約移植・逐語移植ではない)
    - 成果物本文・対話は日本語、CLI 引数・JSON キーは英語のままとすること
    - 配布は個人利用前提で distributable:false (marketplace 非掲載)

