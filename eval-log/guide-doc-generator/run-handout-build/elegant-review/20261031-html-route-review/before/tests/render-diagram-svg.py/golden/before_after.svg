  <rect x="16" y="55" width="346" height="96" rx="8" fill="var(--surface, #ffffff)" stroke="var(--line, #dbe6ef)" stroke-width="1" />
  <text x="189" y="84" fill="var(--ink-muted, #5b6b7a)" font-size="17" text-anchor="middle" font-weight="700">変更前</text>
  <circle cx="32" cy="101" r="3" fill="var(--line, #dbe6ef)" aria-hidden="true" />
