<svg id="hbdg-dg-compare-1" role="img" viewBox="0 0 860 209">
  <title>案Aと案Bの比較</title>
  <text x="16" y="32" fill="var(--ink, #1b2733)" font-size="16" text-anchor="start" font-weight="700">案Aと案Bの比較</text>
  <rect x="16" y="55" width="828" height="44" rx="8" fill="var(--pop-primary-soft, #d9edfe)" stroke="var(--pop-primary-deep, #2273b8)" stroke-width="1" />
  <text x="383" y="81" fill="var(--ink, #1b2733)" font-size="14" text-anchor="middle" font-weight="600">費用</text>
  <text x="690" y="81" fill="var(--ink, #1b2733)" font-size="14" text-anchor="middle" font-weight="600">速さ</text>
  <rect x="16" y="99" width="828" height="47" rx="8" fill="var(--surface, #ffffff)" stroke="var(--line, #dbe6ef)" stroke-width="1" />
  <text x="28" y="127" fill="var(--ink, #1b2733)" font-size="16" text-anchor="start" font-weight="600">案A</text>
  <text x="383" y="125" fill="var(--ink-muted, #5b6b7a)" font-size="14" text-anchor="middle">高い</text>
