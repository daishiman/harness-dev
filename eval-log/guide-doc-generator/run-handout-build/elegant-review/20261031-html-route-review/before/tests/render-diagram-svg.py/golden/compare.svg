  <text x="28" y="174" fill="var(--ink, #1b2733)" font-size="16" text-anchor="start" font-weight="600">案B</text>
  <text x="383" y="172" fill="var(--ink-muted, #5b6b7a)" font-size="14" text-anchor="middle">安い</text>
  <text x="690" y="172" fill="var(--ink-muted, #5b6b7a)" font-size="14" text-anchor="middle">遅い</text>
  <line x1="230" y1="146" x2="230" y2="193" stroke="var(--line, #dbe6ef)" stroke-width="1" aria-hidden="true" />
  <line x1="537" y1="146" x2="537" y2="193" stroke="var(--line, #dbe6ef)" stroke-width="1" aria-hidden="true" />
