# マイグレーション: データベースの「入れ物の形」を変える。
# 3本の中で唯一、失敗したときにデータを失いうる。だから自動では絶対に走らせない。
#
# 設計方針:
#   - 引き金は手動のみ（workflow_dispatch）。push では絶対に動かさない。
#   - 実行前に必ずバックアップを取る。取れなければ止まる。
#   - confirm 欄に APPLY と打たないと進まない。押し間違いで本番が変わるのを防ぐ。
#     （Environments の承認者機能は private + Free プランでは使えないため、この方式で代替する）
#
# 使う前に <DB名> を実際のデータベース名に置き換えること（wrangler.toml / wrangler.jsonc の
# d1_databases の database_name と同じもの）。
#
# npm / yarn / pnpm のどれでもそのまま動く（ロックファイルから自動判別する）。
name: Migrate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 本番DBを変更します。よければ APPLY と入力してください
        type: string
        required: true

concurrency:
  # マイグレーションの同時実行は絶対に避ける。走行中は待たせる（打ち切らない）。
  group: migrate-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # CLOUDFLARE_*はRepository secretではなく、このEnvironmentへ登録する。
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: 入力確認
        # ここで落ちれば以降は一切実行されない。
        if: ${{ inputs.confirm != 'APPLY' }}
        run: |
          echo "::error::confirm に APPLY と入力されていません。中止します。"
          exit 1

      - uses: actions/checkout@v7

      - name: Node.jsと依存関係を準備
        id: pm
        uses: ./.github/actions/detect-pm

      - name: 本番設定を検証
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::productionのCLOUDFLARE_API_TOKENが未登録です"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::productionのCLOUDFLARE_ACCOUNT_IDが未登録です"; exit 1; }

      # 先にバックアップ。ここが失敗したらマイグレーションには進ませない。
      - name: バックアップ取得
        run: ${{ steps.pm.outputs.run }} db:backup

      # 後から取り出せるように残す。
      # 注意: Artifact は認証なしでは落とせないが、リポジトリの書き込み権限を持つ人は
      # 全員取得できる。個人情報を含むデータベースでは保管期間を短くしておく。
      - name: バックアップを保管
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup.sql
          retention-days: 14

      - name: 未適用のマイグレーションを表示
        run: ${{ steps.pm.outputs.exec }} wrangler d1 migrations list <DB名> --remote

      - name: マイグレーション適用
        run: ${{ steps.pm.outputs.run }} db:migrate:remote

# このあと必ず Deploy を実行すること。
# 順番は「マイグレーション → デプロイ」で固定。逆にすると、新しいアプリが
# まだ存在しない列を読みにいって本番が落ちる。
#
# 逆に「マイグレーションだけ済んで、アプリは古いまま」は安全な状態。
# 列が増えただけなら古いアプリはその列を知らないだけで動き続ける。
# 途中で止まったときは、この状態で止めておけばよい。
